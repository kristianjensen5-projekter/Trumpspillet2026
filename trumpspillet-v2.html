function updateActors(dt){
  // blink scheduling (player always; Lars only matters in Greenland)
  const t=now();
  [player,GL.lars].forEach(o=>{
    if (!o.nextBlink||t>o.nextBlink){ o.blinkUntil=t+120; o.nextBlink=t+2000+Math.random()*2500; }
  });
  if (scene===SCENE.OVAL){
    updateOval(dt);
    updateNuke();
    updateOvalMedalDrop(dt);
    return;
  }
  if (scene===SCENE.EPSTEIN){ return; } // updateEpstein runs from step (needs dt even under GS.over=false gating)
  if (scene===SCENE.KREMLIN){
    if (!KR.putin.nextBlink||t>KR.putin.nextBlink){ KR.putin.blinkUntil=t+120; KR.putin.nextBlink=t+2000+Math.random()*2500; }
    updateTug();
    updateWagner(dt);
    updateNobelDrop(dt);
    return;
  }
  if (scene===SCENE.GOLF){
    updateGolf(dt);
    return;
  }
  if (scene!==SCENE.GREENLAND) return;
  CLOUDS.forEach(c=>{ c.x+=c.vx*dt; if (c.x>CAM.worldW+c.w) c.x=-c.w; });
  updateBear(dt);
  // Lars blown-up physics
  if (GL.lars.blownUp){
    GL.lars.vy+=800*dt;
    GL.lars.x+=GL.lars.vx*dt; GL.lars.y+=GL.lars.vy*dt;
    GL.lars.rotation=(GL.lars.rotation||0)+10*dt;
  }
  // parachute flag drop
  if (flagDrop && !flagDrop.landed){
    flagDrop.vy=Math.min(flagDrop.vy+200*dt,150);
    flagDrop.y+=flagDrop.vy*dt;
    flagDrop.x+=(player.x-flagDrop.x)*2*dt;
    if (flagDrop.y>=player.y-20){
      flagDrop.landed=true; flagDrop.x=player.x;
      GL.flag={x:player.x,y:GROUND_Y};
      GL.state.flagPlanted=true;
      say(player, L.flagLanded, 3000);
      SFX.achievement();
      spawnSparks(player.x,player.y-30,20);
    }
  }
  // fight-win flag drop onto head
  if (glFlagDrop && glFlagDrop.active){
    glFlagDrop.vy+=300*dt; glFlagDrop.y+=glFlagDrop.vy*dt;
    glFlagDrop.swingPhase+=dt*4; glFlagDrop.swingAmp*=0.992;
    const headY=player.y-40;
    if (glFlagDrop.y>=headY){
      glFlagDrop.y=headY; glFlagDrop.active=false;
      spawnConfetti(player.x,headY,60);
      SFX.achievement();
      setTimeout(()=>say(player, L.fightWon, 3000),600);
    }
  }
  // ice chunks
  if (glacierExplosion.active){
    glacierExplosion.iceChunks=glacierExplosion.iceChunks.filter(c=>{
      c.life-=dt*1000; if (c.life<=0) return false;
      c.vy+=1120*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.rotation+=c.rotSpeed*dt;
      if (c.y>=GROUND_Y){ c.y=GROUND_Y; c.vy*=-0.3; c.vx*=0.8; }
      return true;
    });
  }
}

function drawGreenland(){
  beginWorld();
  // sky
  const grad=ctx.createLinearGradient(0,0,0,CFG.WORLD_H);
  grad.addColorStop(0,'#dff4ff'); grad.addColorStop(1,'#a7dfff');
  ctx.fillStyle=grad; ctx.fillRect(CAM.x-2,0,CAM.viewW+4,CFG.WORLD_H);
  // extend ice floor below the world on very tall screens (rare, clamped scale)
  ctx.fillStyle='#e7fbff'; ctx.fillRect(CAM.x-2,CFG.WORLD_H,CAM.viewW+4,400);
  // clouds
  CLOUDS.forEach(c=>{ ctx.globalAlpha=c.a; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(c.x,c.y,c.w/2,c.h/2,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; });
  // glaciers (background)
  GL.glaciers.forEach(drawGlacier);
  // ground
  ctx.fillStyle='#e7fbff'; ctx.fillRect(CAM.x-2,GROUND_Y,CAM.viewW+4,CFG.FLOOR_H);
  ctx.fillStyle='#cfeef9';
  for (let i=0;i<6;i++) ctx.fillRect(CAM.x-2,GROUND_Y+20+i*18,CAM.viewW+4,4);
  // objects
  drawMine(GL.mine.x,GL.mine.y);
  if (GL.state.mineFlagPlanted) drawUSFlagPole(GL.mine.x+45,GROUND_Y);
  drawRig(GL.rig.x,GL.rig.y);
  drawShopStall(GL.shop);
  if (GL.flag) drawFlag(GL.flag.x,GL.flag.y);
  if (flagDrop && !flagDrop.landed) drawFlag(flagDrop.x,flagDrop.y);
  drawBear(GL.bear.x,GL.bear.y,GL.bear);
  drawBearHP(GL.bear);
  if (!GL.lars.blownUp || GL.lars.y<CFG.WORLD_H+100)
    drawLars(GL.lars.x,GL.lars.y,GL.lars, GL.lars.blownUp?GL.lars.rotation:0);
  if (!entryHeli.active) drawHeli(GL.heli.x,GL.heli.y,0.35);
  drawTrump(player.x,player.y,player.facing);
  GL.coins.forEach(c=>{ if(!c.collected) drawGoldBar(c); });
  // planted dynamite markers
  const t=now();
  for (let i=PLANTED.length-1;i>=0;i--){
    const p=PLANTED[i];
    if (t-p.start>p.ttl){ PLANTED.splice(i,1); continue; }
    ctx.fillStyle='#d32f2f';
    ctx.fillRect(p.x-6,p.y-12,6,14); ctx.fillRect(p.x+2,p.y-12,6,14);
    ctx.fillStyle='#333'; ctx.fillRect(p.x-6,p.y-8,6,2); ctx.fillRect(p.x+2,p.y-8,6,2);
    ctx.fillStyle=Math.floor(t/120)%2?'#ffd54f':'#ff9800';
    ctx.fillRect(p.x+8,p.y-14,2,2);
    if (!p.lastSparkAt||t-p.lastSparkAt>140){ spawnSparks(p.x+8,p.y-14,3); p.lastSparkAt=t; }
  }
  // explosion flashes
  glacierExplosion.explosions.forEach(exp=>{
    const el=now()-exp.time;
    if (el<exp.duration){
      const prog=el/exp.duration, size=prog*100, a=1-prog;
      ctx.globalAlpha=a; ctx.fillStyle=`rgba(255,165,0,${a})`;
      ctx.beginPath(); ctx.arc(exp.x,exp.y,size,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=`rgba(255,255,255,${a*0.7})`;
      ctx.beginPath(); ctx.arc(exp.x,exp.y,size*0.5,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
  });
  glacierExplosion.iceChunks.forEach(c=>{
    ctx.globalAlpha=clamp(c.life/3000,0,1); ctx.fillStyle='#e8f4f8';
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rotation);
    ctx.fillRect(-c.size/2,-c.size/2,c.size,c.size); ctx.restore();
    ctx.globalAlpha=1;
  });
  drawFx();
  // entry helicopter (world space, descends onto pad)
  if (entryHeli.active) drawHeli(entryHeli.x,entryHeli.y,1);
  // fight-win flag falling
  if (glFlagDrop && glFlagDrop.active)
    drawGreenlandFlagSprite(player.x, glFlagDrop.y, Math.sin(glFlagDrop.swingPhase)*glFlagDrop.swingAmp);
  // rising water
  if (glacierExplosion.active && glacierExplosion.waterLevel>0){
    ctx.save(); ctx.globalAlpha=0.7; ctx.fillStyle='#4a90e2';
    const wl=CFG.WORLD_H-glacierExplosion.waterLevel;
    ctx.fillRect(CAM.x-2,wl,CAM.viewW+4,glacierExplosion.waterLevel);
    ctx.globalAlpha=0.3; ctx.fillStyle='#fff';
    for (let x=Math.floor(CAM.x/40)*40;x<CAM.x+CAM.viewW;x+=40){
      ctx.fillRect(x, wl+Math.sin(now()*0.005+x*0.02)*3-2, 30, 4);
    }
    ctx.restore();
  }
  // speech bubbles
  const placed=[];
  // Player first, then NPCs — overlap-avoidance stacks later bubbles above.
  // (The old v1 “raise Lars 70px” hack is gone; stacking handles it now.)
  renderActorBubble(player,placed,'trump');
  renderActorBubble(GL.lars,placed,'lars');
  renderActorBubble(GL.bear,placed,'bear');
  // nav hints (world space, only until used)
  drawNavHints();
  endWorld();
}

const IS_TOUCH = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;

let last=now();
function step(t){
  try{
    const dt=Math.min(0.033,(t-last)/1000); last=t;
    if (scene===SCENE.INTRO){ requestAnimationFrame(step); return; }

    /* update */
    if (!GS.over){
      if (FightEngine.active){
        // touch: a held finger (>200ms) on left/right half moves in the fight too
        let tl=false,tr=false;
        for (const p of pointers.values()){
          if (now()-p.startT>200){ if (p.zone<0) tl=true; else tr=true; }
        }
        FightEngine.update(dt,{left:keys.has('fl')||tl, right:keys.has('fr')||tr});
      } else if (scene!==SCENE.GOLF && !anyOverlayActive() && !walkTween && !tug && !flagOverlay){
        // keyboard + held-touch movement
        let dx=0;
        if (keys.has('arrowleft')) dx-=1;
        if (keys.has('arrowright')) dx+=1;
        if (!dx){
          // held touch (any pointer held >250ms, or moved = treat as hold immediately)
          for (const p of pointers.values()){
            if (p.fight) continue;
            if (now()-p.startT>200 || p.moved){ dx=p.zone; break; }
          }
        }
        if (dx){
          const submerged = glacierExplosion.active && glacierExplosion.waterLevel>0 &&
            (player.y-38) > (CFG.WORLD_H-glacierExplosion.waterLevel);
          player.x += dx*CFG.SPEED*(player.speedMul||1)*(submerged?0.85:1)*dt;
          player.facing=Math.sign(dx);
          player.walking=true; player.walkCycle+=dt*8;
          player.x=clamp(player.x,40,CAM.worldW-40);
        } else if (!walkTween){ player.walking=false; player.walkCycle=0; }
      }
      if (!FightEngine.active) stepWalkTween(t);
      // jump
      if (jumpTween){
        const k=Math.min(1,(t-jumpTween.start)/jumpTween.dur);
        player.y=GROUND_Y-Math.sin(k*Math.PI)*jumpTween.height;
        if (k>=1){ jumpTween=null; if (!entryHeli.active) player.y=GROUND_Y; }
      } else if (!entryHeli.active) player.y=GROUND_Y;
      // entry heli
      if (entryHeli.active){
        const k=Math.min(1,(now()-entryHeli.start)/entryHeli.dur);
        entryHeli.y=entryHeli.startY+(entryHeli.targetY-entryHeli.startY)*k;
        player.x=entryHeli.x+30; player.y=entryHeli.y+18;
        if (k>0.6) spawnDownwash(entryHeli.x,entryHeli.y+12);
        if (k>=1){
          entryHeli.active=false; introPlayed=true;
          player.y=GROUND_Y;
          if (scene===SCENE.OVAL){
            // walk behind the Resolute Desk, then the premise card (once)
            startWalkTo(OV.trumpDeskX, ()=>{
              if (entryHeli.line) say(player,entryHeli.line,1800);
              if (!OV.introShown){ OV.introShown=true; ovalStartIntroCard(); }
              else { OV.d.phase='waiting'; OV.d.timer=now()+700; }
            });
          } else if (scene===SCENE.KREMLIN){
            startWalkTo(player.x+40, ()=>{
              if (entryHeli.line) say(player,entryHeli.line,1800);
              if (!KR.introShown){
                KR.introShown=true;
                openInfoCard(DATA.KREMLIN.INTRO_CARD, ()=>{
                  closeInfoCard();
                  say(KR.putin, KL.putinSetup, 3200);
                });
              }
            });
          } else {
            startWalkTo(player.x+40, ()=>{ if (entryHeli.line) say(player,entryHeli.line,1800); });
          }
        }
      }
      updateActors(dt);
      if (scene===SCENE.EPSTEIN) updateEpstein(dt);
      updateFx(dt);
      // coin collection while airborne (not while riding the entry heli)
      const sceneCoins = scene===SCENE.GREENLAND?GL.coins : scene===SCENE.OVAL?OV.coins : scene===SCENE.KREMLIN?KR.coins : null;
      if (player.y<GROUND_Y-4 && sceneCoins && !entryHeli.active){
        const hx=player.x, hy=player.y-38;
        sceneCoins.forEach(c=>{
          if (c.collected) return;
          if (dist2(hx,hy,c.x,c.y-20)<20){
            c.collected=true; collectedCoins++; player.gold++;
            spawnSparks(c.x,c.y-20,15); SFX.click();
            if (collectedCoins===10 && !player.speedBoost10){ player.speedBoost10=true; player.baseSpeedMul*=1.25; updateSpeedMul(); say(player,'Speed boost! +25%',2000); }
            if (collectedCoins===18 && !player.healthBoost18){ player.healthBoost18=true; say(player,'Health boost unlocked!',2000); }
            if (collectedCoins>=totalCoinCount() && !player.masterCollector){ player.masterCollector=true; say(player,'Gold Rush Master! All gold bars found!',3000); }
            renderHUD();
          }
        });
      }
    }
    // camera: during an Oval audience, frame Trump AND the guest together
    let camFocus=player.x;
    if (scene===SCENE.OVAL && OV.guest.visible &&
        ['guest_entering','guest_asking','answered','bonus','tan_reject'].includes(OV.d.phase)){
      camFocus=(player.x+OV.guest.x)/2;
    }
    updateCamera(camFocus);

    /* draw */
    beginScreen();
    ctx.clearRect(0,0,VW,VH);
    if (scene===SCENE.GREENLAND) drawGreenland();
    else if (scene===SCENE.OVAL){ drawOval(); drawNuke(); }
    else if (scene===SCENE.KREMLIN){ drawKremlin(); if (tug) drawTug(); if (flagOverlay) drawFlagOverlayScreen(); }
    else if (scene===SCENE.EPSTEIN){ drawEpstein(); }
    else if (scene===SCENE.GOLF){ drawGolf(); }
    if (FightEngine.active) FightEngine.draw();
    // overlays (screen space)
    if (choiceOverlay) drawChoiceOverlay();
    if (infoCard) drawInfoCardOverlay();
    if (GS.over) drawGameOver();
    // toast
    if (toastMsg && now()<toastUntil){
      beginScreen();
      ctx.font='12px system-ui';
      const w=ctx.measureText(toastMsg).width+24;
      ctx.fillStyle='rgba(0,0,0,.65)';
      roundRectPath(ctx,(VW-w)/2,VH-64,w,28,8); ctx.fill();
      ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.fillText(toastMsg,VW/2,VH-45); ctx.textAlign='left';
    }
    // contextual action chip (mobile)
    updateActionChip();
    updateMobileToolButtons();

    requestAnimationFrame(step);
  }catch(err){
    console.error('Game loop error:',err);
    setTimeout(()=>requestAnimationFrame(step),100);
  }
}
function updateActionChip(){
  let show=false, label='E';
  if (!GS.over && !anyOverlayActive()){
    if (scene===SCENE.GREENLAND){
      if (FightEngine.active && !FightEngine.countdown){ show=true; label='👊'; }
      else if (!FightEngine.active){
        const nearObj=nearestGL();
        if (nearObj){ show=true;
          label = nearObj.type==='heli'?'🚁' : nearObj.type==='shop'?'🛒' :
                  nearObj.type==='lars'?'💬' : nearObj.type==='bear'?'🐻' :
                  player.selectedItem==='dynamite'?'🧨' : 'E';
        }
      }
    } else if (scene===SCENE.OVAL){
      const nearObj=nearestOV();
      if (nearObj){ show=true;
        label = nearObj.type==='heli'?'🚁' : nearObj.type==='door'?'🚪' :
                nearObj.type==='surprise'?'☢️' : nearObj.type==='aide'?'🧴' : 'E';
      }
    } else if (scene===SCENE.EPSTEIN){
      show=false;
    } else if (scene===SCENE.KREMLIN && !tug && !flagOverlay){
      const nearObj=nearestKR();
      if (nearObj){ show=true;
        label = nearObj.type==='heli'?'🚁' : nearObj.type==='door'?'🚪' :
                nearObj.type==='putin'?'🤝' : nearObj.type==='statue'?'💰' : 'E';
      }
    }
  }
  actBtn.textContent=label;
  actBtn.classList.toggle('show', show);
}
function updateMobileToolButtons(){
  if (!IS_TOUCH){
    invBtn.classList.remove('show','active');
    tweetBtn.classList.remove('show');
    return;
  }
  const blocked = scene===SCENE.INTRO || GS.over || anyOverlayActive() || FightEngine.active || !!tug || !!flagOverlay;
  const invShow = inventory.length>0 && scene!==SCENE.INTRO && !GS.over;
  if (!invShow) invEl.classList.add('hidden');
  invBtn.classList.toggle('show', invShow);
  invBtn.classList.toggle('active', invShow && !invEl.classList.contains('hidden'));
  const tweetScenes = [SCENE.GREENLAND, SCENE.OVAL, SCENE.KREMLIN];
  tweetBtn.classList.toggle('show', !blocked && tweetScenes.includes(scene));
}
