<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Trumpspillet 2026</title>
<style>
  /* ================================================================
     TRUMPSPILLET 2026 — v2 (rebuild)
     One responsive file: desktop + mobile share the same codebase.
     Mobile-first: touch is a first-class input, not an afterthought.
     ================================================================ */
  html,body{margin:0;height:100%;background:#dff4ff;color:#111;
    font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    overflow:hidden;overscroll-behavior:none}
  canvas#game{display:block;width:100%;height:100%;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

  /* --- HUD (top-right): lives + gold --- */
  .hud{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(44px,env(safe-area-inset-top));
    z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:6px;
    color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);pointer-events:none}
  .chip{display:flex;align-items:center;gap:6px;font-size:clamp(12px,3.2vw,14px);font-weight:600;
    background:rgba(0,0,0,.55);border-radius:10px;padding:4px 8px}
  .chip canvas{display:block}

  /* --- Progress pills (top-center) --- */
  .areas{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);
    z-index:10;display:flex;gap:5px;flex-wrap:nowrap;max-width:96vw;overflow-x:auto;
    pointer-events:none;scrollbar-width:none}
  .areas::-webkit-scrollbar{display:none}
  .pill{background:rgba(0,0,0,.7);color:#fff;border-radius:10px;padding:4px 9px;
    font-size:clamp(10px,2.8vw,13px);font-weight:500;white-space:nowrap}
  .pill.done{background:rgba(0,150,0,.8)}
  .pill.active{box-shadow:0 0 0 2px rgba(255,255,255,.6) inset}

  /* --- Inventory (right side, toggled) --- */
  .inv{position:fixed;right:max(10px,env(safe-area-inset-right));top:44%;transform:translateY(-50%);
    z-index:11;background:rgba(0,0,0,.75);color:#fff;border-radius:12px;padding:8px;
    display:flex;flex-direction:column;gap:6px;align-items:center;backdrop-filter:blur(4px)}
  .inv.hidden{display:none}
  .slot{width:66px;height:56px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;flex-shrink:0}
  .slot.empty{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.28)}
  .slot.selected{outline:2px solid #ff0;background:rgba(255,255,0,.18)}
  .slot canvas{display:block}

  /* --- Help / controls (bottom-left, desktop-oriented) --- */
  .helpbox{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));
    z-index:10;background:rgba(0,0,0,.7);color:#fff;border-radius:12px;padding:8px 10px;
    font-size:12px;line-height:1.5;max-width:320px}
  .helpbox kbd{background:rgba(255,255,255,.18);padding:0 .4em;border-radius:5px}
  .helpbox .panel{display:none;margin-top:6px}
  .helpbox.open .panel{display:block}
  .helpbox button{appearance:none;border:none;border-radius:999px;padding:5px 10px;
    background:rgba(255,255,255,.15);color:#fff;font:600 12px system-ui;cursor:pointer}
  @media (pointer:coarse){ .helpbox{display:none} } /* touch users get touch UX, not key legends */

  /* --- Mobile action button (contextual E) — invisible-assistance philosophy:
         no permanent joysticks; a single subtle action chip only appears
         when standing near something interactable. --- */
  .actbtn{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));
    z-index:12;width:64px;height:64px;border-radius:50%;border:none;
    background:rgba(0,0,0,.55);color:#fff;font:800 15px system-ui;
    box-shadow:0 2px 10px rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
  .actbtn.show{display:flex}
  @media (pointer:fine){ .actbtn{display:none !important} }

  /* --- Intro screen --- */
  .intro-screen{position:fixed;inset:0;z-index:100;background:#efe8d2;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    font-family:'Courier New',monospace;color:#1a1a1a;text-align:center;
    padding:20px;box-sizing:border-box;gap:16px}
  .intro-title{font-size:clamp(22px,7vw,48px);font-weight:800;color:#141414;
    text-shadow:0 1px 0 rgba(255,255,255,.5),0 2px 4px rgba(0,0,0,.2);letter-spacing:1px;margin:0}
  .intro-subtitle{font-size:clamp(13px,3.6vw,20px);color:#2a2a2a;max-width:90%;line-height:1.5;margin:0}
  .intro-prompt{font-size:clamp(13px,3vw,18px);color:#1f1f1f;font-weight:700;letter-spacing:1px;
    animation:blinkGlow 1.2s ease-in-out infinite;margin:0}
  @keyframes blinkGlow{
    0%,40%{opacity:1;text-shadow:0 0 5px #ff00ff,0 0 10px #ff00ff,0 0 15px #ff00ff}
    50%,90%{opacity:.4;text-shadow:0 0 2px #ff00ff}
    100%{opacity:1;text-shadow:0 0 5px #ff00ff,0 0 10px #ff00ff,0 0 15px #ff00ff}}
  .intro-button{appearance:none;border:2px solid #2b2b2b;background:rgba(0,0,0,.06);
    color:#1e1e1e;font-family:'Courier New',monospace;font-weight:800;
    padding:12px 26px;border-radius:10px;cursor:pointer;font-size:16px}
  .intro-button:active{transform:scale(.98);background:rgba(0,0,0,.15)}
  #intro-canvas{image-rendering:pixelated;border:2px solid #3a3a3a;background:#fff;
    max-width:min(88vw,560px);width:100%;height:auto;flex-shrink:0}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>

<script>
(() => {
'use strict';

/* ================================================================
   0. DATA + UTILS
   ================================================================ */
const DATA = JSON.parse(document.getElementById('game-data').textContent);
const CFG = DATA.CONFIG;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const dist2 = (ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const now = ()=>performance.now();
const rand = (a,b)=>a+Math.random()*(b-a);
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];

/* Distance from point to axis-aligned rect centered at (cx,cy) */
function distToRect(px,py,cx,cy,w,h){
  const dx=Math.max(Math.abs(px-cx)-w/2,0), dy=Math.max(Math.abs(py-cy)-h/2,0);
  return Math.hypot(dx,dy);
}

/* ================================================================
   1. CANVAS + CAMERA
   World coordinates: logical units. World height = 540, floor at
   y = 420 (WORLD_H - FLOOR_H). The camera scales by viewport height
   and follows the player horizontally — this is what makes portrait
   mobile work without a separate mobile file.
   ================================================================ */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let DPR=1, VW=0, VH=0;            // CSS pixels
const CAM = { scale:1, x:0, viewW:0, worldW: CFG.GREENLAND_W };
const GROUND_Y = CFG.WORLD_H - CFG.FLOOR_H; // 420

function fit(){
  DPR = window.devicePixelRatio || 1;
  VW = Math.round(window.innerWidth);
  VH = Math.round(window.innerHeight);
  cvs.width = Math.round(VW*DPR);
  cvs.height = Math.round(VH*DPR);
  // Scale so the 540-unit world height fills the screen (min cap so very
  // wide desktop windows don't blow sprites up absurdly)
  CAM.scale = clamp(VH / CFG.WORLD_H, 0.5, 2.4);
  CAM.viewW = VW / CAM.scale;
}
fit();
addEventListener('resize', fit);

function updateCamera(focusX){
  if (CAM.viewW >= CAM.worldW){ CAM.x = (CAM.worldW - CAM.viewW)/2; return; }
  CAM.x = clamp(focusX - CAM.viewW/2, 0, CAM.worldW - CAM.viewW);
}
function beginWorld(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.save();
  // camera shake lives here so every world draw gets it
  if (now()<SHAKE.until){
    const p=(SHAKE.until-now())/SHAKE.dur;
    ctx.translate((Math.random()-0.5)*SHAKE.amp*p,(Math.random()-0.5)*SHAKE.amp*p);
  }
  ctx.scale(CAM.scale, CAM.scale);
  ctx.translate(-CAM.x, 0);
}
function endWorld(){ ctx.restore(); }
function beginScreen(){ ctx.setTransform(DPR,0,0,DPR,0,0); }
function screenToWorld(sx,sy){ return { x: sx/CAM.scale + CAM.x, y: sy/CAM.scale }; }

/* ================================================================
   2. AUDIO — SFX + music engine (music disabled by default, as in v1)
   iOS rule: volume ONLY via GainNodes, never HTMLMediaElement.volume.
   ================================================================ */
let audioCtx=null, audioReady=false;
function ensureAudio(){
  if (!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ return; } }
  if (audioCtx.state==='suspended') audioCtx.resume();
  audioReady = true;
}
function tone(freq, dur, type='sine', vol=0.3){
  if (!audioCtx || audioCtx.state!=='running') return;
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=freq; o.type=type;
    g.gain.value=vol*0.7;
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(_){}
}
function chord(fs,dur,vol=0.2){ fs.forEach((f,i)=>setTimeout(()=>tone(f,dur,'sine',vol), i*50)); }
const SFX = {
  click:()=>tone(800,.1,'square',.2),
  buttonPress:()=>tone(600,.15,'square',.3),
  success:()=>chord([523,659,784],.5,.25),
  error:()=>tone(200,.3,'sawtooth',.3),
  helicopter:()=>{ for(let i=0;i<10;i++) setTimeout(()=>tone(100+Math.random()*50,.1,'sawtooth',.15), i*50); },
  explosion:()=>{ tone(60,.5,'sawtooth',.4); setTimeout(()=>tone(40,.8,'square',.3),100); },
  whoosh:()=>{ for(let i=0;i<5;i++) setTimeout(()=>tone(400-i*50,.1,'sine',.2), i*30); },
  achievement:()=>chord([523,659,784,1047],.8,.3),
  tweet:()=>{ tone(1000,.1,'sine',.15); setTimeout(()=>tone(1200,.1,'sine',.12),120); },
  heartbeat:()=>{ tone(80,.1,'sine',.4); setTimeout(()=>tone(80,.1,'sine',.4),150); },
  punchHit:()=>{ tone(120,.06,'sawtooth',.3); setTimeout(()=>tone(60,.04,'square',.25),30); }
};
/* Music engine placeholder — chiptune tracks live in v1 and will be ported
   in a later build step. Disabled by default (matches v1 decision). */
const Music = {
  disabled:true, muted:(localStorage.getItem('trumpv2-music-muted')==='1'),
  start(){}, stop(){},
  setMuted(m){ this.muted=!!m; try{localStorage.setItem('trumpv2-music-muted', m?'1':'0');}catch(_){} }
};

/* ================================================================
   3. GLOBAL STATE
   ================================================================ */
const SCENE = { INTRO:'intro', GREENLAND:'greenland', OVAL:'oval', KREMLIN:'kremlin', EPSTEIN:'epstein', GOLF:'golf' };
let scene = SCENE.INTRO;

const GS = {
  lives:0, nonViolent:false,
  medals:{ greenland:false, oval:false, kremlin:false, epstein:false, golf:false },
  over:false, overMode:null
};
function loadMedals(){
  try{
    if (location.search.includes('resetMedals=1')){ localStorage.removeItem('trumpv2-medals'); return; }
    const s = localStorage.getItem('trumpv2-medals');
    if (s){ const p=JSON.parse(s); Object.keys(GS.medals).forEach(k=>{ if(p[k]) GS.medals[k]=true; }); }
  }catch(_){}
}
function saveMedals(){ try{ localStorage.setItem('trumpv2-medals', JSON.stringify(GS.medals)); }catch(_){} }
loadMedals();

const player = {
  x:240, y:GROUND_Y, facing:1, walking:false, walkCycle:0,
  say:'', speakingUntil:0, nextBlink:0, blinkUntil:0, nodPhase:Math.random()*6.28,
  tanLevel:0, capOn:false, goldenShoesOn:false,
  baseSpeedMul:1, speedMul:1, selectedItem:null, gold:0,
  speedBoost10:false, healthBoost18:false, masterCollector:false
};
function updateSpeedMul(){ player.speedMul = (player.baseSpeedMul||1) * (player.goldenShoesOn?2:1); }
function say(who, txt, ms){ who.say=txt; who.speakingUntil = now() + (ms||CFG.BUBBLE_TIME); }

/* Inventory */
const inventory = []; // {id, qty?}
let collectedCoins = 0;
function hasItem(id){ return inventory.some(it=>it.id===id); }
function addToInventory(id){
  const ex = inventory.find(it=>it.id===id);
  if (id==='dynamite'){
    if (ex) ex.qty=(ex.qty||0)+5; else inventory.push({id, qty:5});
  } else if (!ex){
    const order=['tan','shoes','maga','dynamite'];
    let at = inventory.findIndex(it=> order.indexOf(it.id)>order.indexOf(id) || order.indexOf(it.id)===-1);
    if (at===-1) at=inventory.length;
    inventory.splice(at,0,{id});
  }
  renderInv();
}
function consumeDynamite(){
  const d = inventory.find(it=>it.id==='dynamite');
  if (!d) return;
  d.qty = Math.max(0,(d.qty||1)-1);
  if (d.qty===0){ inventory.splice(inventory.indexOf(d),1); player.selectedItem=null; }
  renderInv();
}

function iconCanvas(w,h,draw){

  c.width=w*d; c.height=h*d; c.style.width=w+'px'; c.style.height=h+'px';
  const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0); draw(g,w,h);
  return c;
}

    g.fillStyle='#d32f2f'; g.fillRect(-8,-6,6,16); g.fillRect(2,-6,6,16);

function renderInv(){
  invEl.innerHTML='';
  Object.keys(DATA.ITEMS).forEach(id=>{
    const item = inventory.find(it=>it.id===id) || null;
    const d=document.createElement('div');
    d.className='slot'+(item?'':' empty')+(player.selectedItem===id?' selected':'');
    d.appendChild(iconCanvas(66,56,(g)=>{
      g.fillStyle='rgba(255,255,255,.06)'; g.fillRect(0,0,66,56);
      if (item) drawSlotIcon(g,id); else { g.globalAlpha=.5; drawSlotIcon(g,id); g.globalAlpha=1; }
      g.fillStyle='#fff'; g.font='bold 9px system-ui'; g.textAlign='center';
      let name = item ? DATA.ITEMS[id].name : '—';
      if (item && id==='dynamite') name += ' x'+(item.qty||0);
      if (item && isEquipped(id)) name += ' ✓';
      g.fillText(name, 33, 46);
    }));
    d.addEventListener('pointerdown', e=>{ e.stopPropagation(); if (item) useItem(id); });
    invEl.appendChild(d);
  });

function isEquipped(id){
  if (id==='shoes') return player.goldenShoesOn;
  if (id==='tan') return (player.tanLevel||0)>0;
  if (id==='maga') return player.capOn;
  return false;
}
function toggleInventory(){ invEl.classList.toggle('hidden'); renderInv(); }
function useItem(id){
  if (!hasItem(id)) { say(player,'No '+DATA.ITEMS[id].name+' in inventory',900); return; }
  if (id==='tan'){ player.tanLevel=Math.min(5,(player.tanLevel||0)+1); say(player,'Self-tanner +1',1000); spawnSparks(player.x, player.y-44, 10); }
  else if (id==='shoes'){ player.goldenShoesOn=!player.goldenShoesOn; updateSpeedMul(); say(player, player.goldenShoesOn?'Gold shoes on! Speed x2.':'Gold shoes off.',1000); }
  else if (id==='maga'){ player.capOn=!player.capOn; say(player, player.capOn?'Hat on.':'Hat off.',900); }
  else if (id==='dynamite'){ selectDynamite(true); }
  renderInv(); renderHUD();
}
let dynDeselectTimer=null;
function selectDynamite(on){
  const has = inventory.find(it=>it.id==='dynamite' && (it.qty||0)>0);
  if (on && !has){ say(player, DATA.GREENLAND.LINES.dynNone, 1400); return; }
  player.selectedItem = on ? 'dynamite' : null;
  say(player, on ? DATA.GREENLAND.LINES.dynSelected : DATA.GREENLAND.LINES.dynDeselected, 1300);
  renderInv();
  clearTimeout(dynDeselectTimer);
  if (on) dynDeselectTimer = setTimeout(()=>{ if (player.selectedItem==='dynamite'){ player.selectedItem=null; renderInv(); } }, 10000);
}

   5. SPEECH BUBBLES (canvas, world space)
   ================================================================ */
const BUBBLE_PAL = {
  trump:{fill:'rgba(255,165,0,.85)',stroke:'rgba(60,40,0,.9)',text:'#111',tail:'#ffbf47'},
  lars:{fill:'rgba(40,80,120,.85)',stroke:'rgba(180,210,240,.9)',text:'#fff',tail:'rgba(40,80,120,.85)'},
  bear:{fill:'rgba(240,240,240,.85)',stroke:'rgba(50,50,50,.7)',text:'#111',tail:'rgba(240,240,240,.85)'},
  default:{fill:'rgba(0,0,0,.7)',stroke:'rgba(255,255,255,.85)',text:'#fff',tail:'rgba(0,0,0,.7)'}
};
function wrapLines(text,maxChars){
  const out=[];
  String(text).split('\n').forEach(chunk=>{
    const words=chunk.trim().split(/\s+/).filter(Boolean);
    let line='';
    words.forEach(w=>{ const t=line?line+' '+w:w; if (t.length<=maxChars) line=t; else { if(line) out.push(line); line=w; } });
    if (line) out.push(line);
    if (!words.length) out.push('');
  });
  return out;
}
function roundRectPath(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
/* Bubble layout rules (learned from mobile test 2026-07-03):
   1. Bubbles grow UPWARD from the speaker — the whole box sits above the
      head, never over the sprite (multi-line used to grow down over it).
   2. Clamp to the camera view FIRST, then run overlap-avoidance on the
      final (clamped) rects — clamping after collision-check was exactly
      what made bubbles stack on top of each other on narrow phones. */
function drawBubble(text,x,y,speaker,placed){
  const pad=8, fs=13, lh=17;
  ctx.font=`${fs}px system-ui`;
  const maxChars = CAM.viewW < 420 ? 22 : 28; // narrower wrap on phones
  const lines=wrapLines(text,maxChars);
  const w=Math.max(80, Math.max(...lines.map(l=>ctx.measureText(l).width))+pad*2);
  const h=lines.length*lh+8;
  const headY = y-52;                 // just above the sprite's head
  let bx = x - w/2;                   // centered over speaker …
  bx = clamp(bx, CAM.x+6, CAM.x+CAM.viewW-w-6); // … but inside the view
  let by = headY - h - 10;            // whole box above the head
  const overlaps=(r1,r2)=>!(r1.x+r1.w<r2.x||r2.x+r2.w<r1.x||r1.y+r1.h<r2.y||r2.y+r2.h<r1.y);
  let tries=0;
  while (placed.some(r=>overlaps({x:bx,y:by,w,h},r)) && tries<8){ by-=(h+10); tries++; }
  by = Math.max(by, 6);               // never off the top of the world
  placed.push({x:bx,y:by,w,h});
  const pal = BUBBLE_PAL[speaker]||BUBBLE_PAL.default;
  ctx.fillStyle=pal.fill; ctx.strokeStyle=pal.stroke; ctx.lineWidth=1.5;
  roundRectPath(ctx,bx,by,w,h,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle=pal.text;
  lines.forEach((l,i)=>ctx.fillText(l,bx+pad,by+lh*(i+0.7)));
  // tail: from bubble bottom down toward the head
  const tx = clamp(x, bx+14, bx+w-14);
  ctx.beginPath(); ctx.fillStyle=pal.tail;
  ctx.moveTo(tx-7,by+h-1); ctx.lineTo(tx+7,by+h-1); ctx.lineTo(x, Math.min(headY, by+h+16));
  ctx.closePath(); ctx.fill();
}
function renderActorBubble(actor,placed,speaker,yAdjust){
  if (actor.speakingUntil > now()){
    drawBubble(actor.say, actor.x, actor.y+(yAdjust||0), speaker, placed);
  }
}

/* ================================================================
   6. PARTICLES + SHAKE
   ================================================================ */
const fx = { blood:[], sparks:[], oil:[], flame:[], confetti:[], downwash:[] };
const P_SPAWN = {
  blood:{vx:[-30,30],vy:[-70,-10],life:[400,700],size:[3,5]},
  sparks:{vx:[-60,60],vy:[-180,-40],life:[300,600],size:[2,4]},
  oil:{vx:[-30,30],vy:[-200,-80],life:[900,1500],size:[3,6],extra:{landed:false}},
  flame:{vx:[-40,40],vy:[40,120],life:[300,550],size:[2,5],colors:['#ff9800','#ffd54f']},
  downwash:{vx:[-30,30],vy:[-60,-20],life:[300,600],size:[3,6]},
  confetti:{vx:[-120,120],vy:[-360,-80],life:[900,1800],size:[2,5],colors:['#e91e63','#9c27b0','#3f51b5','#03a9f4','#009688','#8bc34a','#ffeb3b','#ff9800'],rot:true}
};
function spawnP(type,x,y,count,extra){
  const c=P_SPAWN[type]; if(!c) return;
  for (let i=0;i<count;i++){
    const p={x,y,vx:rand(c.vx[0],c.vx[1]),vy:rand(c.vy[0],c.vy[1]),life:rand(c.life[0],c.life[1]),size:Math.floor(rand(c.size[0],c.size[1]))};
    if (c.colors) p.color=pick(c.colors);
    if (c.rot){ p.rot=Math.random()*6.28; p.rotSpeed=rand(-2,2); }
    if (c.extra) Object.assign(p,c.extra);
    if (extra) Object.assign(p,extra);
    fx[type].push(p);
  }
}
const spawnBlood=(x,y,n=8)=>spawnP('blood',x,y,n);
const spawnSparks=(x,y,n=12)=>spawnP('sparks',x,y,n);
const spawnOil=(x,y,n=18)=>spawnP('oil',x,y,n);
const spawnFlame=(x,y,n=10)=>spawnP('flame',x,y,n);
const spawnConfetti=(x,y,n=40)=>spawnP('confetti',x,y,n);
const spawnDownwash=(x,y)=>spawnP('downwash',x,y,5,{color:'rgba(255,255,255,0.6)'});

function updateFx(dt){
  for (const type of Object.keys(fx)){
    fx[type] = fx[type].filter(p=>{ p.life-=dt*1000; return p.life>0; });
    fx[type].forEach(p=>{
      if (type==='oil'){
        if (!p.landed){ p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
          if (p.y>=GROUND_Y){ p.y=GROUND_Y; p.vy=0; p.vx*=0.5; p.landed=true; p.life+=800; } }
        else { p.vx*=0.9; p.x+=p.vx*dt; }
        return;
      }
      const grav = type==='flame'?0 : type==='blood'?132 : type==='downwash'?104 : 228;
      p.vy += grav*dt;
      p.vx*=0.98; p.vy*=0.98;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      if (p.rotSpeed) p.rot+=p.rotSpeed*dt;
    });
  }
}
function drawFx(){
  ctx.save();
  fx.blood.forEach(p=>{ ctx.globalAlpha=clamp(p.life/400,0,1); ctx.fillStyle='#b31217'; ctx.fillRect(p.x,p.y,p.size,p.size); });
  fx.sparks.forEach(p=>{ const a=clamp(p.life/300,0,1); ctx.globalAlpha=a; ctx.fillStyle=a>.5?'#ffd54f':'#ff9800'; ctx.fillRect(p.x,p.y,p.size,p.size); });
  fx.oil.forEach(p=>{ ctx.globalAlpha=clamp(p.life/900,0.1,1); ctx.fillStyle='#111'; ctx.fillRect(p.x,p.y,p.size,p.size); });
  fx.flame.forEach(p=>{ ctx.globalAlpha=clamp(p.life/300,0,1); ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.size,p.size); });
  fx.downwash.forEach(p=>{ ctx.globalAlpha=clamp(p.life/400,0,1); ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.size,p.size); });
  fx.confetti.forEach(p=>{ ctx.globalAlpha=clamp(p.life/1200,0,1); ctx.fillStyle=p.color;
    ctx.save(); ctx.translate(p.x+p.size/2,p.y+p.size/2); ctx.rotate(p.rot||0); ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore(); });
  ctx.restore(); ctx.globalAlpha=1;
}
const SHAKE={until:0,amp:0,dur:0};
function triggerShake(amp,dur){ SHAKE.amp=amp; SHAKE.dur=dur; SHAKE.until=now()+dur; }

/* ================================================================
   7. SPRITES — ported nearly 1:1 from v1 (this IS the game's look).
   All drawing happens in world units (v1 sprite units at SCALE=1).
   ================================================================ */
function skinColor(){
  const levels=['#f4cda4','#f1b577','#ee9850','#ea7a28','#e16706','#c65200'];
  return levels[Math.min(5,player.tanLevel||0)];
}
function drawTrump(x,y,dir=1){
  const nod=Math.sin(now()/1100+player.nodPhase)*0.6;
  ctx.save(); ctx.translate(x,y-44+nod);
  const gold=player.goldenShoesOn;
  function leg(lx,ly,w,h){
    const pantH = gold?Math.max(0,h-4):h;
    if (pantH>0){ ctx.fillStyle='#2b2b2b'; ctx.fillRect(lx,ly,w,pantH); }
    if (gold && h-pantH>0){
      const sy=ly+pantH, sh=h-pantH;
      ctx.fillStyle='#f5d36a'; ctx.fillRect(lx,sy,w,sh);
      ctx.fillStyle='#1e4fbf'; ctx.fillRect(lx+1,sy,w-2,1);
      ctx.fillStyle='#ff3b2f'; ctx.fillRect(lx+1,sy+1,w-2,1);
      ctx.fillStyle='#b88a1d'; ctx.fillRect(lx,sy+sh-1,w,1);
    }
  }
  if (player.walking && Math.floor(player.walkCycle)%2===0){ leg(-10,34,9,10); leg(2,36,9,8); }
  else if (player.walking){ leg(-10,36,9,8); leg(2,34,9,10); }
  else { leg(-10,34,9,10); leg(2,34,9,10); }
  ctx.fillStyle='#7a5328'; ctx.fillRect(-12,6,24,26);   // suit
  ctx.fillStyle='#d8e6ff'; ctx.fillRect(-8,10,16,18);   // shirt
  ctx.fillStyle='#e02424'; ctx.fillRect(-2,14,4,14);    // tie
  ctx.fillStyle=skinColor(); ctx.fillRect(-9,-2,18,12); // face
  if (!(player.blinkUntil && now()<player.blinkUntil)){
    ctx.fillStyle='#111'; ctx.fillRect(-6,2,2,2); ctx.fillRect(4,2,2,2);
  } else { ctx.fillStyle='#111'; ctx.fillRect(-6,3,2,1); ctx.fillRect(4,3,2,1); }
  if (player.capOn){ ctx.fillStyle='#c22'; ctx.fillRect(-10,-6,20,6); ctx.fillRect(-12,-2,24,2); }
  else { ctx.fillStyle='#f3a32d'; ctx.fillRect(-10,-6,20,6); }
  // hand item: dynamite when selected, else phone
  const punchOff = FightEngine.punchOut ? 14*dir : 0;
  if (player.selectedItem==='dynamite'){
    ctx.fillStyle='#d32f2f';
    const bx = dir<0 ? -20 : 10;
    ctx.fillRect(bx+punchOff,12,6,14); ctx.fillRect(bx+8+punchOff,12,6,14);
    ctx.fillStyle='#333'; ctx.fillRect(bx+punchOff,16,6,2); ctx.fillRect(bx+8+punchOff,16,6,2);
  } else {
    ctx.fillStyle='#111';
    const bx = dir<0 ? -20 : 10;
    ctx.fillRect(bx+punchOff,12,10,16);
    ctx.fillStyle='#09f'; ctx.fillRect(bx+3+punchOff,16,4,8);
  }
  ctx.restore();
}
function drawLars(x,y,actor,rotation=0){
  const s=0.85, baseH=37;
  const nod = rotation?0:Math.sin(now()/1200+(actor.nodPhase||0))*0.5*s;
  ctx.save(); ctx.translate(x, y-baseH*s+nod);
  if (rotation) ctx.rotate(rotation);
  ctx.scale(s,s);
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(-10,8,20,22);       // jacket
  ctx.fillStyle='#2a2a4e';                                   // lapels
  ctx.beginPath(); ctx.moveTo(-8,8); ctx.lineTo(-2,18); ctx.lineTo(-8,18); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(8,8); ctx.lineTo(2,18); ctx.lineTo(8,18); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillRect(-3,10,6,14);
  ctx.fillStyle='#2c4f9e'; ctx.fillRect(-1,12,2,10);
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(-6,30,6,1); ctx.fillRect(0,30,6,1);
  ctx.fillStyle='#f4c59a'; ctx.fillRect(-9,-2,18,14);        // face
  ctx.fillStyle='#bdbdbd'; ctx.fillRect(-10,-6,20,4); ctx.fillRect(-9,-3,3,6); ctx.fillRect(6,-3,3,6); // grey hair
  ctx.fillStyle='#333'; ctx.fillRect(-7,1,6,4); ctx.fillRect(1,1,6,4); ctx.fillRect(-1,2,2,1); // glasses
  ctx.fillStyle='rgba(200,220,255,0.3)'; ctx.fillRect(-6,2,4,2); ctx.fillRect(2,2,4,2);
  if (!(actor.blinkUntil && now()<actor.blinkUntil)){ ctx.fillStyle='#111'; ctx.fillRect(-5,3,2,1); ctx.fillRect(3,3,2,1); }
  ctx.fillStyle='#c9a080'; ctx.fillRect(-3,8,6,1);
  // pipe + animated smoke
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(6,14,5,6);
  ctx.fillStyle='#f4c59a'; ctx.fillRect(9,12,4,4);
  ctx.fillStyle='#7b4a2f'; ctx.fillRect(11,7,6,4);
  ctx.fillStyle='#5a3a24'; ctx.fillRect(4,9,7,1);
  const st=(now()%3800)/3800;
  if (st<0.35){
    for (let i=0;i<3;i++){
      const p=(st/0.35+i*0.45)%1, fade=Math.max(0,1-p*0.6);
      ctx.fillStyle=`rgba(255,255,255,${0.55*fade})`;
      ctx.beginPath(); ctx.arc(15+p*9, -p*16, 6+p*5, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();

/* ================================================================
   8. OVERLAY SYSTEM — choice menu, info card, game over, continue.
   Only one modal at a time. All are tappable AND keyboard-driven.
   ================================================================ */
const CHOICE_COLORS=['#9feaf2','#e7e77b','#f36a6a','#e892f4','#5f79df'];
let choiceOverlay=null; // {header, options:[{key,label}], onKey, selected, boxes}
let infoCard=null;      // {text, onKey}
function openChoice(header, options, onKey){
  choiceOverlay={ header, options:options.map((label,i)=>({key:String(i+1),label})), onKey, selected:0, boxes:[] };
}
function closeChoice(){ choiceOverlay=null; }
function openInfoCard(text,onKey){ infoCard={text,onKey}; }
function closeInfoCard(){ infoCard=null; }
function anyOverlayActive(){ return !!(choiceOverlay||infoCard); }
function closeAllOverlays(){ choiceOverlay=null; infoCard=null; continueOverlay=null; }

function layoutChoice(){
  if (!choiceOverlay) return null;
  const n=choiceOverlay.options.length;
  const boxW=Math.min(VW*0.86, 420), gap=10;
  const boxH=clamp((VH*0.5-gap*(n-1))/n, 44, 60);
  const totalH=boxH*n+gap*(n-1);
  const headerH=choiceOverlay.header?34:0;
  const startY=(VH-totalH-headerH)/2+headerH;
  const x=(VW-boxW)/2;
  choiceOverlay.boxes = choiceOverlay.options.map((o,i)=>({x, y:startY+i*(boxH+gap), w:boxW, h:boxH, key:o.key, label:o.label}));
  return { headerY:startY-14 };
}
function drawChoiceOverlay(){
  const layout=layoutChoice(); if (!layout) return;
  beginScreen();
  ctx.fillStyle='rgba(0,0,0,.82)'; ctx.fillRect(0,0,VW,VH);
  if (choiceOverlay.header){
    ctx.fillStyle='#fff'; ctx.font='800 19px system-ui'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(choiceOverlay.header, VW/2, layout.headerY);
  }
  ctx.textBaseline='middle'; ctx.textAlign='left';
  choiceOverlay.boxes.forEach((b,i)=>{
    ctx.fillStyle=CHOICE_COLORS[i%CHOICE_COLORS.length];
    ctx.fillRect(b.x,b.y,b.w,b.h);
    if (i===choiceOverlay.selected){ ctx.globalAlpha=.18; ctx.fillStyle='#fff'; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.globalAlpha=1; }
    const lw=(i===choiceOverlay.selected?5:3);
    ctx.lineWidth=lw; ctx.strokeStyle='#fff';
    ctx.strokeRect(b.x+lw/2,b.y+lw/2,b.w-lw,b.h-lw);
    let fs=Math.min(24,b.h*0.5); ctx.font=`800 ${fs}px system-ui`;
    while (ctx.measureText(b.label).width > b.w-36 && fs>11){ fs--; ctx.font=`800 ${fs}px system-ui`; }
    ctx.fillStyle='#fff'; ctx.fillText(b.label, b.x+18, b.y+b.h/2);
  });
  ctx.textBaseline='alphabetic';
}
function drawInfoCardOverlay(){
  beginScreen();
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,0,VW,VH);
  const w=Math.min(VW*0.86,620), h=Math.min(VH*0.6,380);
  const x=(VW-w)/2, y=(VH-h)/2;
  ctx.fillStyle='#f7f5ee'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#c9a641'; ctx.lineWidth=6; ctx.strokeRect(x-6,y-6,w+12,h+12);
  ctx.strokeStyle='#8b7355'; ctx.lineWidth=2; ctx.strokeRect(x-2,y-2,w+4,h+4);
  const lines=infoCard.text.split('\n');
  ctx.fillStyle='#333'; ctx.textAlign='center';
  let fs=16;
  ctx.font=`bold ${fs}px system-ui`;
  while (Math.max(...lines.map(l=>ctx.measureText(l).width)) > w-30 && fs>11){ fs--; ctx.font=`bold ${fs}px system-ui`; }
  const lh=fs*1.45, totalH=lines.length*lh;
  const startY=y+(h-totalH)/2+lh*0.8;
  lines.forEach((l,i)=>ctx.fillText(l, x+w/2, startY+i*lh));

}

const GO = { cause:null, lastScene:null, title:null, subtitle:null, pending:false, timer:null };

function gameOverCause(cause, opts){
  opts=opts||{};

  if (GO.timer) clearTimeout(GO.timer);

    GS.overMode='go_'+GO.cause; GS.over=true; GO.pending=false; GO.timer=null;

/* ================================================================
   9. FIGHT ENGINE — Lars boxing match (Greenland)
   Input flows through the normal router (no capture-phase bridges).
   ================================================================ */
const FightEngine = {
  active:false, punchOut:false, countdown:null,
  trumpHP:100, larsHP:100, MAXHP:100,
  punch:{active:false,t:0,dur:160,cd:260,last:-1e9,hit:false},
  lars:{bobT:0,offsetX:0,jab:{active:false,t:0,dur:180,cd:900,last:-1e9,nextAt:0,hit:false}},
  start(){
    this.active=true;
    this.trumpHP=100; this.larsHP=100;
    this.countdown={start:now(),dur:4600};
    this.punch={active:false,t:0,dur:160,cd:260,last:-1e9,hit:false};
    this.lars={bobT:0,offsetX:0,jab:{active:false,t:0,dur:180,cd:900,last:-1e9,nextAt:now()+5600,hit:false}};
    this.punchOut=false;
    player.walking=false; player.walkCycle=0;
    player.say=''; player.speakingUntil=0;
    const L=GL.lars; L.say=''; L.speakingUntil=0;
  },
  stop(result){
    if (!this.active) return;
    this.active=false; this.punchOut=false;
    GL.state.larsFightRequested=false;
    player.walking=false; player.walkCycle=0;
    if (result && result.winner==='trump'){ startGreenlandFlagDrop(); }
  },
  tryPunch(){
    const p=this.punch, t=now();
    if (this.countdown) return;
    if (!p.active && (t-p.last)>=p.cd){ p.active=true; p.t=0; p.last=t; p.hit=false; }
  },
  update(dt, input){
    if (!this.active) return;
    if (this.countdown){
      if (now()-this.countdown.start>=this.countdown.dur) this.countdown=null;
      else return;
    }
    // movement (left/right only along ground)
    let dx=(input.right?1:0)-(input.left?1:0);
    if (dx){
      player.x += dx*CFG.SPEED*(player.speedMul||1)*dt;
      player.facing=Math.sign(dx);
      player.walking=true; player.walkCycle+=dt*8;
    } else { player.walking=false; player.walkCycle=0; }
    player.x=clamp(player.x,40,CAM.worldW-40); player.y=GROUND_Y;
    // Trump punch
    const p=this.punch;
    if (p.active){
      p.t+=dt*1000;
      const k=p.t/p.dur;
      this.punchOut = k>=0.15 && k<0.65;
      if (!p.hit && k>=0.35 && k<=0.55){
        const d=dist2(player.x,player.y,GL.lars.x,GL.lars.y);
        if (d<80){
          this.larsHP=Math.max(0,this.larsHP-10);
          p.hit=true; this._larsFlashUntil=now()+120;
          SFX.punchHit(); spawnSparks((player.x+GL.lars.x)/2,(player.y+GL.lars.y)/2-30, this.larsHP<=0?30:8);
          if (this.larsHP<=0){ triggerShake(10,400); this.stop({winner:'trump'}); return; }
        }
      }
      if (k>=1){ p.active=false; this.punchOut=false; }
    }
    // Lars AI
    const L=this.lars, actor=GL.lars;
    L.bobT+=dt*1000;
    L.offsetX=Math.sin(L.bobT*0.004)*6;
    const gap=player.x-actor.x;
    if (Math.abs(gap)>60) actor.x += Math.sign(gap)*30*dt;
    const jab=L.jab, t=now();
    if (jab.active){
      jab.t+=dt*1000;
      if (!jab.hit && jab.t>=63 && jab.t<=99){
        const d=dist2(player.x,player.y,actor.x,actor.y);
        if (d<80){
          this.trumpHP=Math.max(0,this.trumpHP-12);
          jab.hit=true; this._trumpFlashUntil=now()+120;
          SFX.punchHit(); spawnSparks((player.x+actor.x)/2,(player.y+actor.y)/2-30, this.trumpHP<=0?30:8);
          if (this.trumpHP<=0){
            triggerShake(10,400); SFX.error();
            this.stop({winner:'lars'});
            gameOverCause('lars-fight',{delayMs:600});
            return;
          }
        }
      }
      if (jab.t>=jab.dur) jab.active=false;
    } else if (t>=jab.nextAt){
      jab.active=true; jab.t=0; jab.hit=false;
      jab.nextAt=t+jab.cd+Math.random()*500;
    }
  },
  draw(){
    if (!this.active) return;
    // countdown overlay (screen space)
    if (this.countdown){
      beginScreen();
      const e=now()-this.countdown.start;
      const phases=[
        {t0:0,t1:1600,text:'FIGHT FOR GREENLAND',size:clamp(VW*0.07,26,48),color:'#fff'},
        {t0:1600,t1:2400,text:'3',size:72,color:'#ff4444'},
        {t0:2400,t1:3200,text:'2',size:72,color:'#ffaa00'},
        {t0:3200,t1:4000,text:'1',size:72,color:'#44ff44'},
        {t0:4000,t1:4600,text:'FIGHT!',size:64,color:'#fff'}
      ];
      ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,0,VW,VH);
      for (const ph of phases){
        if (e>=ph.t0 && e<ph.t1){
          const local=e-ph.t0, dur=ph.t1-ph.t0;
          const alpha=Math.min(1,local/200)*Math.min(1,(dur-local)/200);
          const scale=1+(1-Math.min(1,local/150))*0.4;
          ctx.globalAlpha=alpha; ctx.fillStyle=ph.color;
          ctx.font=`bold ${ph.size*scale}px system-ui`;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=12;
          ctx.fillText(ph.text, VW/2, VH/2);
          ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textBaseline='alphabetic'; ctx.textAlign='left';
          break;
        }
      }
      return;
    }
    // world-space fight FX: arms, flashes, HP bars
    beginWorld();
    const trumpX=player.x, trumpY=player.y;
    const larsX=GL.lars.x+this.lars.offsetX, larsY=GL.lars.y;
    // Trump punching arm
    if (this.punchOut){
      const f=player.facing, shX=trumpX+f*6, shY=trumpY-24;
      ctx.strokeStyle='#7a5328'; ctx.lineWidth=5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(shX,shY); ctx.lineTo(shX+f*10,shY+2); ctx.stroke();
      ctx.lineWidth=4.2;
      ctx.beginPath(); ctx.moveTo(shX+f*10,shY+2); ctx.lineTo(shX+f*24,shY); ctx.stroke();
    }
    // Lars jab arm
    if (this.lars.jab.active){
      const lf=(trumpX<larsX)?-1:1, shX=larsX+lf*5, shY=larsY-22;
      ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=4.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(shX,shY); ctx.lineTo(shX+lf*8,shY+2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(shX+lf*8,shY+2); ctx.lineTo(shX+lf*20,shY); ctx.stroke();
      ctx.fillStyle='#f4c59a'; ctx.beginPath(); ctx.arc(shX+lf*20,shY,3,0,Math.PI*2); ctx.fill();
    }
    if (this._larsFlashUntil && now()<this._larsFlashUntil){
      ctx.globalAlpha=.6; ctx.fillStyle='#fff'; ctx.fillRect(larsX-10,larsY-44,20,44); ctx.globalAlpha=1;
    }
    if (this._trumpFlashUntil && now()<this._trumpFlashUntil){
      ctx.globalAlpha=.6; ctx.fillStyle='#fff'; ctx.fillRect(trumpX-10,trumpY-44,20,44); ctx.globalAlpha=1;
    }
    const drawHP=(name,x,y,hp,color,align)=>{
      const w=70,h=12, px=x-w/2, py=y-80;
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(px,py,w,h);
      ctx.fillStyle=color; ctx.fillRect(px,py,w*clamp(hp/this.MAXHP,0,1),h);
      ctx.fillStyle='#fff'; ctx.font='bold 10px system-ui';
      ctx.textAlign = align==='right'?'right':'left';
      ctx.fillText(name, align==='right'?px+w-6:px+6, py+h-3);
      ctx.textAlign='left';
    };
    drawHP('TRUMP',trumpX,trumpY,this.trumpHP,'#f39c12','left');
    drawHP('LARS',larsX,larsY,this.larsHP,'#2e86de','right');
    endWorld();
    // mobile hint: PUNCH button doubles as the E action chip
  }
};

    ...(GL.lars.blownUp?[]:[GL.lars]),
    ...GL.glaciers.filter(g=>!g.blown)];
  let best=null,bd=1e9;
  for (const o of arr){
    // NB: glaciers use CENTER distance here (like v1) — their huge bounding
    // box would otherwise swallow every interaction near Lars/bear/shop.
    // The loose rect-check lives only in nearestPlantableGlacier().
    // Glaciers also get a small distance penalty so characters standing in
    // front of a glacier (Lars is at x=890, glacier #2 at x=900!) win.
    let d = o.type==='heli' ? distToRect(player.x,player.y,o.x+20,o.y-6,220,120)
          : dist2(player.x,player.y,o.x,o.y);
    if (o.type==='glacier') d += 25;
    if (d<bd){ bd=d; best=o; }
  }
  return bd < CFG.INTERACT_DIST ? best : null;
}
function nearestPlantableGlacier(){
  let best=null,bd=1e9;
  for (const g of GL.glaciers.filter(g=>!g.blown)){
    const d=distToRect(player.x,player.y,g.x,g.y-g.h/2,g.w,g.h);
    if (d<bd){ bd=d; best=g; }
  }
  return bd<30 ? best : null;
}

/* ---- Bear AI ---- */
function updateBear(dt){
  const bear=GL.bear;
  if (!bear.alive) return;
  bear.vx=bear.vx||0; bear.vy=bear.vy||0;
  if (bear.angry && bear.chasing && bear.hp<=0 && bear.y>=GROUND_Y-5){
    const dxT=player.x-bear.x;
    bear.facing=dxT>0?1:-1;
    if (Math.abs(dxT)>30){
      bear.vx += Math.sign(dxT)*bear.speed*dt;
      bear.vx = clamp(bear.vx,-bear.speed,bear.speed);
    } else if (Math.random()<0.02){
      bearAttack(dxT);
    }
  }
  bear.vy += 1400*dt;
  bear.y += bear.vy*dt; bear.x += bear.vx*dt;
  bear.vx *= bear.chasing?0.96:0.92;
  if (bear.y>=GROUND_Y){ bear.y=GROUND_Y; bear.vy=0; bear.vx*=bear.chasing?0.95:0.85; }
  if (bear.x<40){ bear.x=40; bear.vx=Math.abs(bear.vx)*0.3; }
  if (bear.x>CAM.worldW-40){ bear.x=CAM.worldW-40; bear.vx=-Math.abs(bear.vx)*0.3; }
}
function bearAttack(dxT){
  const bear=GL.bear;
  if ((bear.biteCount||0)>=3 || GO.pending || GS.over) return;
  bear.biteCount=(bear.biteCount||0)+1;
  const fatal=bear.biteCount>=3;
  say(bear, fatal?'CHOMP! 🦷🦷🦷':'CHOMP! 🦷', 800);
  spawnBlood(player.x,player.y-10,fatal?24:8);
  player.x += (Math.sign(dxT)||1)*60;
  SFX.error();
  toast(fatal?'🐻 Fatal bear attack!':`🐻 Bear attack! (${bear.biteCount}/3)`);
  if (fatal) setTimeout(()=>gameOverCause('bear',{delayMs:0}),600);
}

function resetOvalDecisions(){

  const shamanIdx = DATA.OVAL.GUESTS.findIndex(g=>g.id==='shaman');
  const others = DATA.OVAL.GUESTS.map((_,i)=>i).filter(i=>i!==shamanIdx);

                             // → answered → (bonus) → guest_leaving → … → complete/failed
                             // tan detour: tan_reject → aide_in → tan_wait → aide_out → re-ask
    order:[...others.slice(0,2), shamanIdx],

    _btnYes:null,_btnNo:null

function ovalCurrentGuest(){

  return (d.idx>=0 && d.idx<d.order.length) ? DATA.OVAL.GUESTS[d.order[d.idx]] : null;

function ovalStartIntroCard(){

function ovalNextGuest(){

  d.phase='guest_entering';

function ovalAskQuestion(){
  const d=OV.d, g=ovalCurrentGuest();
  if (g.requiresTan && (player.tanLevel||0)<2 && !d.tanSolved){
    OV.guest.say=g.noTanText; OV.guest.speakingUntil=now()+5000;
    d.phase='tan_reject'; d.timer=now()+2600;

    d.tanPraised=true;
    OV.guest.say=g.tanPraise; OV.guest.speakingUntil=now()+2200;
    setTimeout(()=>{ if (OV.d.phase==='guest_asking'){ OV.guest.say=g.question; OV.guest.speakingUntil=now()+60000; } },2300);
  } else {
    OV.guest.say=g.question; OV.guest.speakingUntil=now()+60000;
  }
  d.phase='guest_asking';
}
function ovalAnswer(answer){
  const d=OV.d, g=ovalCurrentGuest();
  if (d.phase!=='guest_asking'||!g) return;
  const isCorrect = answer===g.correctAnswer;
  say(player, answer==='yes'?g.yesText:g.noText, 2200);
  OV.guest.speakingUntil=0;
  if (isCorrect){
    d.correct++;
    d.results.push({correct:true});
    d.feedback={text:OL.approveText, good:true, until:now()+2000};
    d.breakingNews={text:g.newsCorrect, good:true, until:now()+4200};
    ovalChoir(true); SFX.success();
  } else {
    d.results.push({correct:false});
    d.feedback={text:OL.rejectText, good:false, until:now()+2000};
    d.breakingNews={text:g.newsWrong, good:false, until:now()+4200};
    ovalChoir(false); SFX.error();
  }
  d.pendingBonus = isCorrect && !!g.triggersBonus;
  d.phase='answered'; d.timer=now()+2100;
}
function ovalChoir(happy){
  OV.yes.say = happy ? pick(DATA.OVAL.PRAISE) : pick(DATA.OVAL.BOO);
  OV.yes.mood = happy ? 'happy' : 'angry';
  OV.yes.speakingUntil = now()+1600;
}
function updateOval(dt){
  const d=OV.d, t=now(), walk=180;
  // aide walking animation states
  if (OV.aide.active){
    if (OV.aide.phase==='in'){
      const target=player.x-55;
      OV.aide.x+=walk*dt;
      if (OV.aide.x>=target){
        OV.aide.x=target; OV.aide.phase='wait';
        say(OV.aide, OL.aideTan, 60000);
      }
    } else if (OV.aide.phase==='out'){
      OV.aide.x-=walk*dt;
      if (OV.aide.x<=-60){ OV.aide.active=false; OV.aide.phase=null; ovalAskQuestion(); }
    }
  }
  switch (d.phase){
    case 'waiting':
      if (t>=d.timer) ovalNextGuest();
      break;
    case 'guest_entering':
      OV.guest.x-=walk*dt;
      if (OV.guest.x<=OV.guestTargetX){ OV.guest.x=OV.guestTargetX; ovalAskQuestion(); }
      break;
    case 'tan_reject':
      if (t>=d.timer){
        d.phase='aide_in';
        OV.aide.active=true; OV.aide.x=-60; OV.aide.phase='in';
        say(player,'Too pale?! Somebody fix this!',1800);
      }
      break;
    case 'answered':
      if (t>=d.timer){
        if (d.pendingBonus){
          d.pendingBonus=false;
          OV.guest.say=OL.bonusHint; OV.guest.speakingUntil=now()+3800;
          d.phase='bonus'; d.timer=now()+3900;
        } else { d.phase='guest_leaving'; }
      }
      break;
    case 'bonus':
      if (t>=d.timer) d.phase='guest_leaving';
      break;
    case 'guest_leaving':
      OV.guest.x+=walk*dt;
      if (OV.guest.x>=CAM.worldW+60){ OV.guest.visible=false; d.phase='waiting'; d.timer=now()+800; }
      break;
  }
  // yes-men blink
  OV.yes.members.forEach(m=>{ if (!m.nextBlink||t>m.nextBlink){ m.blinkUntil=t+120; m.nextBlink=t+2000+Math.random()*2500; } });
}

  player.tanLevel=Math.max(2, player.tanLevel||0);

function updateNuke(){
  if (!NUKE.active) return;
  if (now()-NUKE.start>=NUKE.dur){
    NUKE.active=false;
    gameOverCause('nuke',{delayMs:400});
  }
}
function drawNuke(){
  if (!NUKE.active) return;
  beginScreen();
  const k=Math.min(1,(now()-NUKE.start)/NUKE.dur);
  const x=VW/2, y=(VH+200)-(VH+460)*k;
  const s=Math.max(2,VW/320);
  ctx.save();
  ctx.fillStyle='#bbb'; ctx.fillRect(x-10*s,y-40*s,20*s,40*s);
  ctx.beginPath(); ctx.moveTo(x,y-56*s); ctx.lineTo(x-10*s,y-40*s); ctx.lineTo(x+10*s,y-40*s);
  ctx.closePath(); ctx.fillStyle='#999'; ctx.fill();
  ctx.fillStyle='#777'; ctx.fillRect(x-16*s,y-18*s,6*s,12*s); ctx.fillRect(x+10*s,y-18*s,6*s,12*s);
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(x,y-26*s,6*s,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffd54f';
  for (let i=0;i<3;i++){
    const a0=i*2*Math.PI/3-Math.PI/6;
    ctx.beginPath(); ctx.moveTo(x,y-26*s); ctx.arc(x,y-26*s,5*s,a0,a0+Math.PI/3); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='#ff9800'; ctx.fillRect(x-6*s,y,12*s,12*s);
  ctx.fillStyle='#ffd54f'; ctx.fillRect(x-3*s,y+2*s,6*s,6*s);
  ctx.restore();
}
/* ---- Oval medal drop (100% approval) ---- */
let ovalMedalDrop=null;
function startOvalMedalDrop(){ ovalMedalDrop={y:-80,vy:0,swingPhase:0,swingAmp:0.5,active:true}; }
function updateOvalMedalDrop(dt){
  const m=ovalMedalDrop; if (!m||!m.active) return;
  m.vy+=300*dt; m.y+=m.vy*dt; m.swingPhase+=dt*4; m.swingAmp*=0.992;
  const chestY=player.y-25;
  if (m.y>=chestY){
    m.y=chestY; m.active=false;
    spawnConfetti(player.x,chestY,60); SFX.achievement();
    setTimeout(()=>say(player,'I am the greatest president!',3000),600);
  }
}
function drawOvalMedalDrop(){
  const m=ovalMedalDrop; if (!m||!m.active) return;
  ctx.save(); ctx.translate(player.x,m.y); ctx.rotate(Math.sin(m.swingPhase)*m.swingAmp);
  ctx.fillStyle='#B22234'; ctx.fillRect(-6,-16,4,16);
  ctx.fillStyle='#fff'; ctx.fillRect(-2,-16,4,16);
  ctx.fillStyle='#3C3B6E'; ctx.fillRect(2,-16,4,16);
  ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fillStyle='#FFD700'; ctx.fill();
  ctx.strokeStyle='#DAA520'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#DAA520'; ctx.beginPath();
  for (let i=0;i<5;i++){ const a=i*4*Math.PI/5-Math.PI/2; const px=Math.cos(a)*5, py=Math.sin(a)*5;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawYesGroup(x,y){
  const praising = OV.yes.speakingUntil>now();
  const suits=['#cc0000','#ffffff','#0044cc'];
  for (let i=0;i<3;i++){
    const m=OV.yes.members[i]||{nodPhase:i};
    const dx=x+(-34+i*34);
    const nod=Math.sin(now()/900+(m.nodPhase||0))*1.0;
    ctx.save(); ctx.translate(dx,y-44+nod);
    ctx.fillStyle='#2b2b2b'; ctx.fillRect(-10,34,9,10); ctx.fillRect(2,34,9,10);
    if (m.isF){
      if (i===0){ ctx.fillStyle='#e91e63'; ctx.fillRect(-10,8,20,26); }
      else { ctx.fillStyle='#c01818'; ctx.fillRect(-10,8,20,26);
        ctx.fillStyle='#fff'; ctx.fillRect(-2,8,4,26); ctx.fillRect(-10,20,20,4); }
    } else { ctx.fillStyle=suits[i%3]; ctx.fillRect(-10,8,20,26); }
    ctx.fillStyle='#e8d7c2'; ctx.fillRect(-8,-2,16,12);
    if (!(m.blinkUntil && now()<m.blinkUntil)){ ctx.fillStyle='#111'; ctx.fillRect(-5,2,2,2); ctx.fillRect(3,2,2,2); }
    if (m.isF){ ctx.fillStyle='#6b4328'; ctx.fillRect(-9,-5,18,5); ctx.fillRect(-10,-2,4,16); ctx.fillRect(6,-2,4,16); }
    else { ctx.fillStyle='#444'; ctx.fillRect(-9,-5,18,5); }
    const hs=[1.0,0.85,1.15][i%3];
    ctx.fillStyle='#cc0000'; ctx.fillRect(-9*hs,-8,18*hs,5); ctx.fillRect(-11*hs,-4,6*hs,2);
    ctx.fillStyle='#fff'; ctx.font=`bold ${3*hs}px sans-serif`; ctx.textAlign='center';
    ctx.fillText('MAGA',0,-5); ctx.textAlign='left';
    ctx.globalAlpha=0.9; ctx.fillStyle=suits[i%3];
    if (praising){
      ctx.fillRect(-14,0,4,14); ctx.fillRect(10,0,4,14); // arms up
      const happy=OV.yes.mood==='happy';
      ctx.fillStyle=happy?'#00aa00':'#cc0000'; ctx.fillRect(-12,-28,24,14);
      ctx.fillStyle='#fff'; ctx.font='bold 8px sans-serif'; ctx.textAlign='center';
      ctx.fillText(happy?'YES!':'BOO!',0,-18); ctx.textAlign='left';
    } else {
      ctx.globalAlpha=0.5; ctx.fillRect(-14,15,4,10); ctx.fillRect(10,15,4,10);
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }
}
function drawOvalTV(){
  const d=OV.d;
  const tvW=200, tvH=250;
  const cx=OV.deskX+OV.deskW/2, cy=110+tvH/2-40;
  ctx.fillStyle='#111'; ctx.fillRect(cx-tvW/2-6,cy-tvH/2-6,tvW+12,tvH+12);
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(cx-tvW/2,cy-tvH/2,tvW,tvH);
  const pad=8, innerW=tvW-2*pad, innerH=tvH-2*pad;
  const topH=innerH*0.55, newsY=cy-tvH/2+pad;
  // BREAKING NEWS
  ctx.fillStyle='#0a1628'; ctx.fillRect(cx-innerW/2,newsY,innerW,topH);
  ctx.fillStyle='#cc0000'; ctx.fillRect(cx-innerW/2,newsY,innerW,20);
  ctx.fillStyle='#fff'; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
  ctx.fillText('BREAKING NEWS',cx,newsY+15);
  const contentY=newsY+24;
  if (d.breakingNews && now()<d.breakingNews.until){
    ctx.fillStyle=d.breakingNews.good?'#2e7d32':'#c62828';
    ctx.fillRect(cx-innerW/2+4,contentY,innerW-8,topH-28);
    ctx.fillStyle='#fff'; ctx.font='bold 10px system-ui';
    const words=d.breakingNews.text.split(' ');
    let line='', ly=contentY+18;
    for (const w of words){
      const t=line+w+' ';
      if (ctx.measureText(t).width>innerW-20 && line){ ctx.fillText(line.trim(),cx,ly); line=w+' '; ly+=14; }
      else line=t;
    }
    if (line) ctx.fillText(line.trim(),cx,ly);
  } else {
    ctx.fillStyle='#333'; ctx.fillRect(cx-innerW/2+4,contentY,innerW-8,topH-28);
    ctx.fillStyle='#666'; ctx.font='10px system-ui';
    ctx.fillText('Awaiting presidential',cx,contentY+28);
    ctx.fillText('decision...',cx,contentY+44);
  }
  // MAGA DASHBOARD
  const dashY=newsY+topH+4;
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(cx-innerW/2,dashY,innerW,innerH-topH-4);
  ctx.fillStyle='#fff'; ctx.font='bold 9px system-ui';
  ctx.fillText('MAGA APPROVAL',cx,dashY+13);
  const barX=cx-innerW/2+8, barY=dashY+18, barW=innerW-16, barH=10;
  const approval=Math.round((d.correct||0)/3*100);
  ctx.fillStyle='#333'; ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle=approval>=100?'#4caf50':approval>=34?'#ffc107':'#ff6b6b';
  ctx.fillRect(barX,barY,barW*approval/100,barH);
  ctx.fillStyle='#fff'; ctx.font='bold 8px system-ui';
  ctx.fillText(approval+'%',cx,barY+8);
  ctx.font='bold 9px system-ui'; ctx.fillText('DECISIONS',cx,dashY+45);
  const iconY=dashY+50, sp=22, startX=cx-sp;
  for (let i=0;i<3;i++){
    const ix=startX+i*sp;
    if (i<(d.results||[]).length){
      ctx.fillStyle=d.results[i].correct?'#4caf50':'#f44336';
      ctx.fillRect(ix-7,iconY,14,14);
      ctx.fillStyle='#fff'; ctx.font='bold 10px system-ui';
      ctx.fillText(d.results[i].correct?'✓':'✗',ix,iconY+11);
    } else {
      ctx.fillStyle='#444'; ctx.fillRect(ix-7,iconY,14,14);
      ctx.fillStyle='#777'; ctx.font='9px system-ui'; ctx.fillText('?',ix,iconY+10);
    }
  }
  ctx.textAlign='left';
}

function drawOval(){
  beginWorld();
  drawOvalBackdrop();
  drawDoor(OV.door.x,OV.door.y);
  drawYesGroup(OV.yes.x,OV.yes.y);
  OV.coins.forEach(c=>{ if(!c.collected) drawGoldBar(c); });
  if (OV.guest.visible) drawOvalGuest(OV.guest.x,OV.guest.y);
  if (OV.aide.active) drawAide(OV.aide.x,OV.aide.y);
  if (!entryHeli.active) drawHeli(OV.heli.x,OV.heli.y,0.35);
  drawTrump(player.x,player.y,player.facing);
  drawOvalDesk();   // desk in front of Trump (he stands behind it)
  drawFx();
  if (entryHeli.active) drawHeli(entryHeli.x,entryHeli.y,1);
  drawOvalMedalDrop();
  // bubbles — guest nametag registered first so bubbles stack above it
  const placed=[];
  if (OV.guest.visible){
    const g=ovalCurrentGuest();
    const ny=OV.guest.y-((g&&g.appearance&&g.appearance.isShaman)?105:85);
    placed.push({x:OV.guest.x-70,y:ny-12,w:140,h:22});
  }
  renderActorBubble(player,placed,'trump');
  if (OV.guest.visible) renderActorBubble(OV.guest,placed,'default');
  renderActorBubble(OV.yes,placed,'default');
  if (OV.aide.active) renderActorBubble(OV.aide,placed,'default');
  endWorld();
  drawOvalAnswerCards();
}
/* Big tappable YES/NO answer cards (screen space) — the core of package B */
function drawOvalAnswerCards(){
  const d=OV.d;
  if (d.phase!=='guest_asking' || anyOverlayActive() || GS.over){ d._btnYes=null; d._btnNo=null; return; }
  beginScreen();
  const cw=Math.min((VW-48)/2,220), ch=64;
  const cy=VH-ch-Math.max(16,VH*0.03)-6;
  const gap=16;
  const yesX=VW/2-cw-gap/2, noX=VW/2+gap/2;
  d._btnYes={x:yesX,y:cy,w:cw,h:ch};
  d._btnNo={x:noX,y:cy,w:cw,h:ch};
  [[d._btnYes,'#2e7d32','YES','1'],[d._btnNo,'#1565c0','NO','2']].forEach(([b,col,label,key])=>{
    ctx.fillStyle=col;
    roundRectPath(ctx,b.x,b.y,b.w,b.h,12); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    roundRectPath(ctx,b.x+1.5,b.y+1.5,b.w-3,b.h-3,10); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='800 26px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,b.x+b.w/2,b.y+b.h/2);
    if (!IS_TOUCH){
      ctx.font='11px system-ui'; ctx.globalAlpha=0.8;
      ctx.fillText('['+key+']',b.x+b.w/2,b.y+b.h-11);
      ctx.globalAlpha=1;
    }
    ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  });
}

/* ================================================================
   12. INPUT — one router for keyboard, mouse and touch.
   Mobile: hold left/right half = walk · short tap = intent-tap
   (walk to nearest object + interact) · second-finger tap = jump ·
   contextual action chip = E. No capture-phase hacks.
   ================================================================ */
const keys=new Set();
const input={ left:false, right:false };
let jumpTween=null;
let walkTween=null;

function doJump(){
  if (anyOverlayActive()||jumpTween||GS.over) return;
  jumpTween={start:now(),dur:CFG.JUMP_MS,height:player.capOn?CFG.JUMP_H_CAP:CFG.JUMP_H};
}
function startWalkTo(tx,onDone){
  const dx=Math.abs(tx-player.x);
  const dur=Math.min(900,(dx/(CFG.SPEED*(player.speedMul||1)))*1000+150);
  walkTween={sx:player.x,tx,start:now(),dur:Math.max(100,dur),onDone};
  player.facing=Math.sign(tx-player.x)||player.facing;
}
function stepWalkTween(t){
  if (!walkTween) return false;
  const k=Math.min(1,(t-walkTween.start)/walkTween.dur);
  const e=k<0.5?2*k*k:-1+(4-2*k)*k;
  player.x=walkTween.sx+(walkTween.tx-walkTween.sx)*e;
  player.walking=true; player.walkCycle+=1/60*8;
  if (k>=1){ const cb=walkTween.onDone; walkTween=null; player.walking=false; player.walkCycle=0; cb&&cb(); }
  return true;
}
function interact(){
  if (scene===SCENE.GREENLAND) interactGreenland();
  else if (scene===SCENE.OVAL) interactOval();
}

/* --- Keyboard --- */
addEventListener('keydown', e=>{
  const k=(e.key||'').toLowerCase();
  ensureAudio();
  let handled=false;
  if (scene===SCENE.INTRO){
    if (k==='enter'||e.code==='Enter'){ startGame(); handled=true; }
    if (handled) e.preventDefault();
    return;
  }
  if (GS.over){
    if (GS.overMode && String(GS.overMode).startsWith('go_')){
      startContinueOverlay(); handled=true;
    } else if (GS.overMode==='continue'){
      if (k==='r'&&e.shiftKey){ fullRestartToIntro(); }
      else continueSpin();
      handled=true;
    }
    if (handled) e.preventDefault();
    return;
  }
  if (FightEngine.active){
    if (k==='arrowleft'||k==='a'){ keys.add('fl'); handled=true; }
    else if (k==='arrowright'||k==='d'){ keys.add('fr'); handled=true; }
    else if (k==='e'||e.code==='KeyE'){ FightEngine.tryPunch(); handled=true; }
    else if (k==='escape'){ FightEngine.stop({winner:null}); handled=true; }
    if (handled) e.preventDefault();
    return;
  }
  if (choiceOverlay){
    const n=choiceOverlay.options.length;
    if (k==='arrowup'||k==='w'){ choiceOverlay.selected=(choiceOverlay.selected-1+n)%n; handled=true; }
    else if (k==='arrowdown'||k==='s'){ choiceOverlay.selected=(choiceOverlay.selected+1)%n; handled=true; }
    else if (k==='enter'||k===' '){ choiceOverlay.onKey(choiceOverlay.options[choiceOverlay.selected].key); handled=true; }
    else if (k>='1'&&k<='9'&&k.length===1){ const i=+k-1; if (i<n){ choiceOverlay.onKey(k); handled=true; } }
    else if (k==='escape'){ closeChoice(); handled=true; }
    if (handled) e.preventDefault();
    return;
  }
  if (infoCard){
    if (k==='escape'){ closeInfoCard(); }
    else { infoCard.onKey && infoCard.onKey(k); }
    e.preventDefault();
    return;
  }
  // Oval answer cards get first claim on 1/2 while a question is live
  if (scene===SCENE.OVAL && OV.d.phase==='guest_asking' && (k==='1'||k==='2')){
    ovalAnswer(k==='1'?'yes':'no');
    e.preventDefault();
    return;
  }
  // normal gameplay
  keys.add(k);
  if (k==='n'){ GS.nonViolent=!GS.nonViolent; toast(GS.nonViolent?'Non-violent mode ON':'Non-violent mode OFF'); handled=true; }
  else if (k==='m'){ Music.setMuted(!Music.muted); toast(Music.muted?'🔇 Music off':'🔊 Music on'); handled=true; }
  else if (k==='t'){ doTweet(); handled=true; }
  else if (k===' '||k==='arrowup'){ doJump(); handled=true; }
  else if (k==='b'){ toggleInventory(); handled=true; }
  else if (k>='1'&&k<='4'&&k.length===1){ const id=Object.keys(DATA.ITEMS)[+k-1]; if (id&&hasItem(id)) useItem(id); else if (id) say(player,'No '+DATA.ITEMS[id].name+' in inventory',900); handled=true; }
  else if (k==='d'){ selectDynamite(player.selectedItem!=='dynamite'); handled=true; }
  else if (k==='e'){ interact(); handled=true; }
  else if (k==='r'){
    if (e.shiftKey) fullRestartRun();
    else resetGreenlandRunState();
    if (scene===SCENE.GREENLAND) resetGreenland();
    handled=true;
  }
  if (['arrowleft','arrowright','arrowdown',' '].includes(k)) handled=true;
  if (handled) e.preventDefault();
},{passive:false});
addEventListener('keyup', e=>{
  const k=(e.key||'').toLowerCase();
  keys.delete(k);
  if (k==='arrowleft'||k==='a') keys.delete('fl');
  if (k==='arrowright'||k==='d') keys.delete('fr');
});

/* --- Pointer / touch --- */
const pointers=new Map(); // id -> {x,y,startX,startY,startT,zone,moved}
let holdDir=0;            // -1/0/1 from held touch
cvs.addEventListener('pointerdown', e=>{
  ensureAudio();
  if (scene===SCENE.INTRO){ startGame(); return; }
  const sx=e.clientX, sy=e.clientY;
  // overlays eat taps first
  if (GS.over){
    if (GS.overMode==='continue' && continueOverlay){
      const C=continueOverlay;
      const hit=(b)=>b&&sx>=b.x&&sx<=b.x+b.w&&sy>=b.y&&sy<=b.y+b.h;
      if (!C.democratClicked && hit(C._btnDem)){
        C.democratClicked=true; SFX.error();
        setTimeout(()=>fullRestartToIntro(),1800);
        return;
      }
      continueSpin();
    } else if (GS.overMode && String(GS.overMode).startsWith('go_')){
      startContinueOverlay();
    }
    return;
  }
  if (choiceOverlay){
    layoutChoice();
    const hitBox=choiceOverlay.boxes.find(b=>sx>=b.x&&sx<=b.x+b.w&&sy>=b.y&&sy<=b.y+b.h);
    if (hitBox){ choiceOverlay.selected=choiceOverlay.boxes.indexOf(hitBox); choiceOverlay.onKey(hitBox.key); }
    return;
  }
  if (infoCard){ infoCard.onKey && infoCard.onKey('tap'); return; }
  // Oval answer cards (screen space) — before world taps
  if (scene===SCENE.OVAL && OV.d && OV.d.phase==='guest_asking'){
    const hb=b=>b&&sx>=b.x&&sx<=b.x+b.w&&sy>=b.y&&sy<=b.y+b.h;
    if (hb(OV.d._btnYes)){ ovalAnswer('yes'); return; }
    if (hb(OV.d._btnNo)){ ovalAnswer('no'); return; }
  }
  if (FightEngine.active){
    // fight touch controls: left/right half = move, tap in middle third = punch
    pointers.set(e.pointerId,{x:sx,y:sy,startX:sx,startY:sy,startT:now(),zone:sx<VW/2?-1:1,moved:false,fight:true});
    FightEngine.tryPunch(); // any tap also throws a punch — simple & satisfying
    try{cvs.setPointerCapture(e.pointerId);}catch(_){}
    return;
  }
  // gameplay: register pointer. If another pointer is already held → this is a jump tap.
  if (pointers.size>=1){ doJump(); return; }
  pointers.set(e.pointerId,{x:sx,y:sy,startX:sx,startY:sy,startT:now(),zone:sx<VW/2?-1:1,moved:false});
  try{cvs.setPointerCapture(e.pointerId);}catch(_){}
});
cvs.addEventListener('pointermove', e=>{
  const p=pointers.get(e.pointerId); if (!p) return;
  p.x=e.clientX; p.y=e.clientY;
  if (Math.hypot(p.x-p.startX,p.y-p.startY)>14) p.moved=true;
  p.zone = p.x<VW/2?-1:1;
});
function releasePointer(e){
  const p=pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (!p) return;
  const heldMs=now()-p.startT;
  if (p.fight) return;
  if (heldMs<250 && !p.moved && !anyOverlayActive() && !GS.over){
    // SHORT TAP → intent-tap: interact, or walk to nearest object and interact
    const w=screenToWorld(p.x,p.y);
    intentTap(w.x,w.y);
  }
}
cvs.addEventListener('pointerup', releasePointer);
cvs.addEventListener('pointercancel', releasePointer);

function intentTap(wx,wy){
  let best=null,bd=1e9,nearFn=null;
  if (scene===SCENE.GREENLAND){
    nearFn=nearestGL;
    // Specific objects win over glaciers: check them first, then glacier rects.
    const targets=[GL.mine,GL.rig,GL.shop,GL.heli,
      ...(GL.bear.alive?[GL.bear]:[]),
      ...(GL.lars.blownUp?[]:[GL.lars])];
    for (const o of targets){
      const d = dist2(wx,wy,o.x,o.y-20);
      if (d<bd){ bd=d; best=o; }
    }
    if (!best || bd>=110){
      for (const g of GL.glaciers.filter(g=>!g.blown)){
        const d = distToRect(wx,wy,g.x,g.y-g.h/2,g.w,g.h);
        if (d<bd){ bd=d; best=g; }
      }
    }
  } else if (scene===SCENE.OVAL){
    nearFn=nearestOV;
    const targets=[OV.door,OV.heli,OV.surprise,OV.yes,
      ...(OV.aide.active&&OV.aide.phase==='wait'?[{...OV.aide,type:'aide'}]:[])];
    for (const o of targets){
      const d = dist2(wx,wy,o.x,o.y-20);
      if (d<bd){ bd=d; best=o; }
    }
  } else return;
  if (best && bd<110){
    // near enough already? interact now. Otherwise auto-walk then interact.
    const near=nearFn();
    if (near && near.type===best.type){ interact(); return; }
    const side=Math.sign(best.x-player.x)||1;
    const targetX=clamp(best.x-side*(CFG.INTERACT_DIST-6),40,CAM.worldW-40);
    startWalkTo(targetX, ()=>interact());
  } else {
    // tapped empty area: if Trump is already near something, just interact
    if (nearFn()) interact();
  }
}
actBtn.addEventListener('pointerdown', e=>{
  e.stopPropagation(); e.preventDefault();
  ensureAudio();
  if (FightEngine.active){ FightEngine.tryPunch(); return; }
  interact();
});

function updateActors(dt){
  // blink scheduling (player always; Lars only matters in Greenland)
  const t=now();
  [player,GL.lars].forEach(o=>{
    if (!o.nextBlink||t>o.nextBlink){ o.blinkUntil=t+120; o.nextBlink=t+2000+Math.random()*2500; }
  });
  if (scene===SCENE.OVAL){
    updateOval(dt);
    updateNuke();
    updateOvalMedalDrop(dt);
    return;
  }
  if (scene!==SCENE.GREENLAND) return;
  CLOUDS.forEach(c=>{ c.x+=c.vx*dt; if (c.x>CAM.worldW+c.w) c.x=-c.w; });
  updateBear(dt);
  // Lars blown-up physics
  if (GL.lars.blownUp){
    GL.lars.vy+=800*dt;
    GL.lars.x+=GL.lars.vx*dt; GL.lars.y+=GL.lars.vy*dt;
    GL.lars.rotation=(GL.lars.rotation||0)+10*dt;
  }
  // parachute flag drop
  if (flagDrop && !flagDrop.landed){
    flagDrop.vy=Math.min(flagDrop.vy+200*dt,150);
    flagDrop.y+=flagDrop.vy*dt;
    flagDrop.x+=(player.x-flagDrop.x)*2*dt;
    if (flagDrop.y>=player.y-20){
      flagDrop.landed=true; flagDrop.x=player.x;
      GL.flag={x:player.x,y:GROUND_Y};
      GL.state.flagPlanted=true;
      say(player, L.flagLanded, 3000);
      SFX.achievement();
      spawnSparks(player.x,player.y-30,20);
    }
  }
  // fight-win flag drop onto head
  if (glFlagDrop && glFlagDrop.active){
    glFlagDrop.vy+=300*dt; glFlagDrop.y+=glFlagDrop.vy*dt;
    glFlagDrop.swingPhase+=dt*4; glFlagDrop.swingAmp*=0.992;
    const headY=player.y-40;
    if (glFlagDrop.y>=headY){
      glFlagDrop.y=headY; glFlagDrop.active=false;
      spawnConfetti(player.x,headY,60);
      SFX.achievement();
      setTimeout(()=>say(player, L.fightWon, 3000),600);
    }
  }
  // ice chunks
  if (glacierExplosion.active){
    glacierExplosion.iceChunks=glacierExplosion.iceChunks.filter(c=>{
      c.life-=dt*1000; if (c.life<=0) return false;
      c.vy+=1120*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.rotation+=c.rotSpeed*dt;
      if (c.y>=GROUND_Y){ c.y=GROUND_Y; c.vy*=-0.3; c.vx*=0.8; }
      return true;
    });
  }
}

      ctx.globalAlpha=1;
    }
  });
  glacierExplosion.iceChunks.forEach(c=>{

    ctx.fillRect(-c.size/2,-c.size/2,c.size,c.size); ctx.restore();

  if (entryHeli.active) drawHeli(entryHeli.x,entryHeli.y,1);

  // (The old v1 “raise Lars 70px” hack is gone; stacking handles it now.)
  renderActorBubble(player,placed,'trump');

const IS_TOUCH = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;

let last=now();
function step(t){
  try{
    const dt=Math.min(0.033,(t-last)/1000); last=t;
    if (scene===SCENE.INTRO){ requestAnimationFrame(step); return; }

    /* update */
    if (!GS.over){
      if (FightEngine.active){
        // touch: a held finger (>200ms) on left/right half moves in the fight too
        let tl=false,tr=false;
        for (const p of pointers.values()){
          if (now()-p.startT>200){ if (p.zone<0) tl=true; else tr=true; }
        }
        FightEngine.update(dt,{left:keys.has('fl')||tl, right:keys.has('fr')||tr});
      } else if (!anyOverlayActive() && !walkTween){
        // keyboard + held-touch movement
        let dx=0;
        if (keys.has('arrowleft')) dx-=1;
        if (keys.has('arrowright')) dx+=1;
        if (!dx){
          // held touch (any pointer held >250ms, or moved = treat as hold immediately)
          for (const p of pointers.values()){
            if (p.fight) continue;
            if (now()-p.startT>200 || p.moved){ dx=p.zone; break; }
          }
        }
        if (dx){
          const submerged = glacierExplosion.active && glacierExplosion.waterLevel>0 &&
            (player.y-38) > (CFG.WORLD_H-glacierExplosion.waterLevel);
          player.x += dx*CFG.SPEED*(player.speedMul||1)*(submerged?0.85:1)*dt;
          player.facing=Math.sign(dx);
          player.walking=true; player.walkCycle+=dt*8;
          player.x=clamp(player.x,40,CAM.worldW-40);
        } else if (!walkTween){ player.walking=false; player.walkCycle=0; }
      }
      if (!FightEngine.active) stepWalkTween(t);
      // jump
      if (jumpTween){
        const k=Math.min(1,(t-jumpTween.start)/jumpTween.dur);
        player.y=GROUND_Y-Math.sin(k*Math.PI)*jumpTween.height;
        if (k>=1){ jumpTween=null; if (!entryHeli.active) player.y=GROUND_Y; }
      } else if (!entryHeli.active) player.y=GROUND_Y;
      // entry heli
      if (entryHeli.active){
        const k=Math.min(1,(now()-entryHeli.start)/entryHeli.dur);
        entryHeli.y=entryHeli.startY+(entryHeli.targetY-entryHeli.startY)*k;
        player.x=entryHeli.x+30; player.y=entryHeli.y+18;
        if (k>0.6) spawnDownwash(entryHeli.x,entryHeli.y+12);
        if (k>=1){
          entryHeli.active=false; introPlayed=true;
          player.y=GROUND_Y;
          if (scene===SCENE.OVAL){
            // walk behind the Resolute Desk, then the premise card (once)
            startWalkTo(OV.trumpDeskX, ()=>{
              if (entryHeli.line) say(player,entryHeli.line,1800);
              if (!OV.introShown){ OV.introShown=true; ovalStartIntroCard(); }
              else { OV.d.phase='waiting'; OV.d.timer=now()+700; }
            });
          } else {
            startWalkTo(player.x+40, ()=>{ if (entryHeli.line) say(player,entryHeli.line,1800); });
          }
        }
      }
      updateActors(dt);
      updateFx(dt);
      // coin collection while airborne (not while riding the entry heli)
      const sceneCoins = scene===SCENE.GREENLAND?GL.coins : scene===SCENE.OVAL?OV.coins : null;
      if (player.y<GROUND_Y-4 && sceneCoins && !entryHeli.active){
        const hx=player.x, hy=player.y-38;
        sceneCoins.forEach(c=>{
          if (c.collected) return;
          if (dist2(hx,hy,c.x,c.y-20)<20){
            c.collected=true; collectedCoins++; player.gold++;
            spawnSparks(c.x,c.y-20,15); SFX.click();
            if (collectedCoins===10 && !player.speedBoost10){ player.speedBoost10=true; player.baseSpeedMul*=1.25; updateSpeedMul(); say(player,'Speed boost! +25%',2000); }
            if (collectedCoins===18 && !player.healthBoost18){ player.healthBoost18=true; say(player,'Health boost unlocked!',2000); }
            if (collectedCoins>=totalCoinCount() && !player.masterCollector){ player.masterCollector=true; say(player,'Gold Rush Master! All gold bars found!',3000); }
            renderHUD();
          }
        });
      }
    }
    // camera: during an Oval audience, frame Trump AND the guest together
    let camFocus=player.x;
    if (scene===SCENE.OVAL && OV.guest.visible &&
        ['guest_entering','guest_asking','answered','bonus','tan_reject'].includes(OV.d.phase)){
      camFocus=(player.x+OV.guest.x)/2;
    }
    updateCamera(camFocus);

    /* draw */
    beginScreen();
    ctx.clearRect(0,0,VW,VH);
    if (scene===SCENE.GREENLAND) drawGreenland();
    else if (scene===SCENE.OVAL){ drawOval(); drawNuke(); }
    if (FightEngine.active) FightEngine.draw();
    // overlays (screen space)
    if (choiceOverlay) drawChoiceOverlay();
    if (infoCard) drawInfoCardOverlay();
    if (GS.over) drawGameOver();
    // toast
    if (toastMsg && now()<toastUntil){
      beginScreen();
      ctx.font='12px system-ui';
      const w=ctx.measureText(toastMsg).width+24;
      ctx.fillStyle='rgba(0,0,0,.65)';
      roundRectPath(ctx,(VW-w)/2,VH-64,w,28,8); ctx.fill();
      ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.fillText(toastMsg,VW/2,VH-45); ctx.textAlign='left';
    }
    // contextual action chip (mobile)
    updateActionChip();

    requestAnimationFrame(step);
  }catch(err){
    console.error('Game loop error:',err);
    setTimeout(()=>requestAnimationFrame(step),100);
  }
}
function updateActionChip(){
  let show=false, label='E';
  if (!GS.over && !anyOverlayActive()){
    if (scene===SCENE.GREENLAND){
      if (FightEngine.active && !FightEngine.countdown){ show=true; label='👊'; }
      else if (!FightEngine.active){
        const nearObj=nearestGL();
        if (nearObj){ show=true;
          label = nearObj.type==='heli'?'🚁' : nearObj.type==='shop'?'🛒' :
                  nearObj.type==='lars'?'💬' : nearObj.type==='bear'?'🐻' :
                  player.selectedItem==='dynamite'?'🧨' : 'E';
        }
      }
    } else if (scene===SCENE.OVAL){
      const nearObj=nearestOV();
      if (nearObj){ show=true;
        label = nearObj.type==='heli'?'🚁' : nearObj.type==='door'?'🚪' :
                nearObj.type==='surprise'?'☢️' : nearObj.type==='aide'?'🧴' : 'E';
      }
    }
  }
  actBtn.textContent=label;
  actBtn.classList.toggle('show', show);
}

/* ================================================================
   14. BOOT
   ================================================================ */
const introCanvas=document.getElementById('intro-canvas');
drawIntroHeliTrump(introCanvas.getContext('2d'),introCanvas.width,introCanvas.height);
document.getElementById('start-btn').addEventListener('click', e=>{ e.stopPropagation(); startGame(); });
document.getElementById('intro').addEventListener('click', ()=>{ if (scene===SCENE.INTRO) startGame(); });
renderAreas(); renderHUD(); renderInv();
requestAnimationFrame(step);

// Dev-only debug handle (read-only snapshots; harmless in production)
window.__tv2 = {
  snapshot: () => ({
    scene, over: GS.over, overMode: GS.overMode, lives: GS.lives,
    player: { x: Math.round(player.x), y: Math.round(player.y), gold: player.gold },
    bear: { x: Math.round(GL.bear.x), hp: GL.bear.hp, angry: GL.bear.angry,
            chasing: GL.bear.chasing, bites: GL.bear.biteCount, alive: GL.bear.alive },
    lars: { x: Math.round(GL.lars.x), rounds: GL.state.larsDialogRounds,
            fight: GL.state.larsFightRequested, blownUp: GL.lars.blownUp },
    fight: { active: FightEngine.active, trumpHP: FightEngine.trumpHP, larsHP: FightEngine.larsHP },
    oval: { phase: OV.d.phase, idx: OV.d.idx, correct: OV.d.correct,
            guest: (ovalCurrentGuest()||{}).id||null,
            correctAnswer: (ovalCurrentGuest()||{}).correctAnswer||null,
            tan: player.tanLevel, aide: OV.aide.phase, nuke: NUKE.active },
    medals: { ...GS.medals }
  }),
  cheat: { gold: n => { player.gold = n; renderHUD(); } }
};

})();
