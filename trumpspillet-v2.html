<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Trumpspillet 2026</title>
<style>
  /* ================================================================
     TRUMPSPILLET 2026 — v2 (rebuild)
     One responsive file: desktop + mobile share the same codebase.
     Mobile-first: touch is a first-class input, not an afterthought.
     ================================================================ */
  html,body{margin:0;height:100%;background:#dff4ff;color:#111;
    font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    overflow:hidden;overscroll-behavior:none}
  canvas#game{display:block;width:100%;height:100%;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

  /* --- HUD (top-right): lives + gold --- */
  .hud{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(44px,env(safe-area-inset-top));
    z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:6px;
    color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);pointer-events:none}
  .chip{display:flex;align-items:center;gap:6px;font-size:clamp(12px,3.2vw,14px);font-weight:600;
    background:rgba(0,0,0,.55);border-radius:10px;padding:4px 8px}
  .chip canvas{display:block}

  /* --- Progress pills (top-center) --- */
  .areas{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);
    z-index:10;display:flex;gap:5px;flex-wrap:nowrap;max-width:96vw;overflow-x:auto;
    pointer-events:none;scrollbar-width:none}
  .areas::-webkit-scrollbar{display:none}
  .pill{background:rgba(0,0,0,.7);color:#fff;border-radius:10px;padding:4px 9px;
    font-size:clamp(10px,2.8vw,13px);font-weight:500;white-space:nowrap}
  .pill.done{background:rgba(0,150,0,.8)}
  .pill.active{box-shadow:0 0 0 2px rgba(255,255,255,.6) inset}

  /* --- Inventory (right side on desktop, compact bottom drawer on touch) --- */
  .inv{position:fixed;right:max(10px,env(safe-area-inset-right));top:44%;transform:translateY(-50%);
    z-index:11;background:rgba(0,0,0,.75);color:#fff;border-radius:12px;padding:8px;
    display:flex;flex-direction:column;gap:6px;align-items:center;backdrop-filter:blur(4px)}
  .inv.hidden{display:none}
  .slot{width:66px;height:56px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;flex-shrink:0}
  .slot.empty{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.28)}
  .slot.selected{outline:2px solid #ff0;background:rgba(255,255,0,.18)}
  .slot canvas{display:block}
  .inv-close{display:none}

  /* --- Help / controls (bottom-left, desktop-oriented) --- */
  .helpbox{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));
    z-index:10;background:rgba(0,0,0,.7);color:#fff;border-radius:12px;padding:8px 10px;
    font-size:12px;line-height:1.5;max-width:320px}
  .helpbox kbd{background:rgba(255,255,255,.18);padding:0 .4em;border-radius:5px}
  .helpbox .panel{display:none;margin-top:6px}
  .helpbox.open .panel{display:block}
  .helpbox button{appearance:none;border:none;border-radius:999px;padding:5px 10px;
    background:rgba(255,255,255,.15);color:#fff;font:600 12px system-ui;cursor:pointer}
  @media (pointer:coarse){ .helpbox{display:none} } /* touch users get touch UX, not key legends */

  /* --- Mobile action button (contextual E) — invisible-assistance philosophy:
         no permanent joysticks; a single subtle action chip only appears
         when standing near something interactable. --- */
  .actbtn{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));
    z-index:12;width:64px;height:64px;border-radius:50%;border:none;
    background:rgba(0,0,0,.55);color:#fff;font:800 30px system-ui;
    box-shadow:0 2px 10px rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
  .actbtn.show{display:flex}
  @media (pointer:fine){ .actbtn{display:none !important} }
  .toolbtn{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));z-index:12;
    width:50px;height:50px;border-radius:50%;border:none;background:rgba(0,0,0,.55);
    color:#fff;font:800 22px system-ui;box-shadow:0 2px 10px rgba(0,0,0,.35);
    display:none;align-items:center;justify-content:center}
  .toolbtn.show{display:flex}
  .toolbtn.active{background:rgba(255,215,0,.72);color:#111}
  .invbtn{right:max(92px,calc(env(safe-area-inset-right) + 92px))}
  .tweetbtn{right:max(150px,calc(env(safe-area-inset-right) + 150px))}
  @media (pointer:fine){ .toolbtn{display:none !important} }
  @media (pointer:coarse){
    .inv{left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));
      top:auto;bottom:max(84px,calc(env(safe-area-inset-bottom) + 84px));transform:none;
      flex-direction:row;justify-content:flex-start;align-items:center;gap:7px;
      padding:8px 38px 8px 8px;border-radius:12px;max-width:calc(100vw - 20px);
      overflow-x:auto;scrollbar-width:none}
    .inv::-webkit-scrollbar{display:none}
    .slot{width:58px;height:50px}
    .slot canvas{width:58px !important;height:50px !important}
    .inv-close{display:flex;position:sticky;right:0;align-items:center;justify-content:center;
      width:30px;height:30px;margin-left:auto;border:none;border-radius:50%;
      background:rgba(255,255,255,.16);color:#fff;font:900 20px system-ui;flex-shrink:0}
  }

  /* --- Intro screen --- */
  .intro-screen{position:fixed;inset:0;z-index:100;background:#efe8d2;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    font-family:'Courier New',monospace;color:#1a1a1a;text-align:center;
    padding:20px;box-sizing:border-box;gap:16px}
  .intro-title{font-size:clamp(22px,7vw,48px);font-weight:800;color:#141414;
    text-shadow:0 1px 0 rgba(255,255,255,.5),0 2px 4px rgba(0,0,0,.2);letter-spacing:1px;margin:0}
  .intro-subtitle{font-size:clamp(13px,3.6vw,20px);color:#2a2a2a;max-width:90%;line-height:1.5;margin:0}
  .intro-prompt{font-size:clamp(13px,3vw,18px);color:#1f1f1f;font-weight:700;letter-spacing:1px;
    animation:blinkGlow 1.2s ease-in-out infinite;margin:0}
  @keyframes blinkGlow{
    0%,40%{opacity:1;text-shadow:0 0 5px #ff00ff,0 0 10px #ff00ff,0 0 15px #ff00ff}
    50%,90%{opacity:.4;text-shadow:0 0 2px #ff00ff}
    100%{opacity:1;text-shadow:0 0 5px #ff00ff,0 0 10px #ff00ff,0 0 15px #ff00ff}}
  .intro-button{appearance:none;border:2px solid #2b2b2b;background:rgba(0,0,0,.06);
    color:#1e1e1e;font-family:'Courier New',monospace;font-weight:800;
    padding:12px 26px;border-radius:10px;cursor:pointer;font-size:16px}
  .intro-button:active{transform:scale(.98);background:rgba(0,0,0,.15)}
  #intro-canvas{image-rendering:pixelated;border:2px solid #3a3a3a;background:#fff;
    max-width:min(88vw,560px);width:100%;height:auto;flex-shrink:0}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>

function distToRect(px,py,cx,cy,w,h){
  const dx=Math.max(Math.abs(px-cx)-w/2,0), dy=Math.max(Math.abs(py-cy)-h/2,0);
  return Math.hypot(dx,dy);
}
function pointInPolygon(px,py,poly){
  if (!Array.isArray(poly) || poly.length<3) return false;
  let inside=false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++){

}

  DPR = window.devicePixelRatio || 1;
  VW = Math.round(window.innerWidth);
  VH = Math.round(window.innerHeight);
  cvs.width = Math.round(VW*DPR);
  cvs.height = Math.round(VH*DPR);
  // Scale so the 540-unit world height fills the screen (min cap so very
  // wide desktop windows don't blow sprites up absurdly)
  CAM.scale = clamp(VH / CFG.WORLD_H, 0.5, 2.4);
  CAM.viewW = VW / CAM.scale;
}
fit();
addEventListener('resize', fit);

function updateCamera(focusX){
  if (CAM.viewW >= CAM.worldW){ CAM.x = (CAM.worldW - CAM.viewW)/2; return; }

}

  }
  ctx.scale(CAM.scale, CAM.scale);
  ctx.translate(-CAM.x, 0);
}
function endWorld(){ ctx.restore(); }
function beginScreen(){ ctx.setTransform(DPR,0,0,DPR,0,0); }
function screenToWorld(sx,sy){ return { x: sx/CAM.scale + CAM.x, y: sy/CAM.scale }; }

   ================================================================ */

function ensureAudio(){
  if (!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ return; } }
  if (audioCtx.state==='suspended') audioCtx.resume();
  audioReady = true;
}
function tone(freq, dur, type='sine', vol=0.3){
  if (!audioCtx || audioCtx.state!=='running') return;
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=freq; o.type=type;
    g.gain.value=vol*0.7;
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);

}

      return;
    }
    const prev=this.current;
    this.current=track;
    this.pendingScene=null;
    if (prev) this._fadeOut(prev);
    const p=track.el.play();
    if (p && p.catch) p.catch(()=>{ this.pendingScene=sceneName; this._retrySoon(); });
    this._fadeIn(track);
  },
  stop(){
    if (this.retryTimer){ clearTimeout(this.retryTimer); this.retryTimer=null; }
    this.pendingScene=null;
    const prev=this.current;
    this.current=null;
    if (prev) this._fadeOut(prev);
  },
  setMuted(m){
    this.muted=!!m;
    try{ localStorage.setItem('trumpv2-music-muted', this.muted?'1':'0'); }catch(_){}
    if (this.masterGain && audioCtx){
      const t=audioCtx.currentTime;
      this.masterGain.gain.cancelScheduledValues(t);
      this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, t);
      this.masterGain.gain.linearRampToValueAtTime(this.muted?0:this.volume, t+0.12);
    }
    if (!this.muted && typeof scene!=='undefined' && scene!==SCENE.INTRO) this.startForScene(scene);
  }
};

const BUBBLE_PAL = {
  trump:{fill:'rgba(255,165,0,.85)',stroke:'rgba(60,40,0,.9)',text:'#111',tail:'#ffbf47'},
  lars:{fill:'rgba(40,80,120,.85)',stroke:'rgba(180,210,240,.9)',text:'#fff',tail:'rgba(40,80,120,.85)'},
  bear:{fill:'rgba(240,240,240,.85)',stroke:'rgba(50,50,50,.7)',text:'#111',tail:'rgba(240,240,240,.85)'},
  default:{fill:'rgba(0,0,0,.7)',stroke:'rgba(255,255,255,.85)',text:'#fff',tail:'rgba(0,0,0,.7)'}
};
function wrapLines(text,maxChars){
  const out=[];
  String(text).split('\n').forEach(chunk=>{
    const words=chunk.trim().split(/\s+/).filter(Boolean);
    let line='';
    words.forEach(w=>{ const t=line?line+' '+w:w; if (t.length<=maxChars) line=t; else { if(line) out.push(line); line=w; } });
    if (line) out.push(line);
    if (!words.length) out.push('');
  });
  return out;
}
function roundRectPath(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
/* Bubble layout rules (learned from mobile test 2026-07-03):
   1. Bubbles grow UPWARD from the speaker — the whole box sits above the
      head, never over the sprite (multi-line used to grow down over it).
   2. Clamp to the camera view FIRST, then run overlap-avoidance on the
      final (clamped) rects — clamping after collision-check was exactly
      what made bubbles stack on top of each other on narrow phones. */
function drawBubble(text,x,y,speaker,placed){
  const pad=8, fs=13, lh=17;
  ctx.font=`${fs}px system-ui`;
  const maxChars = CAM.viewW < 420 ? 22 : 28; // narrower wrap on phones
  const lines=wrapLines(text,maxChars);
  const w=Math.max(80, Math.max(...lines.map(l=>ctx.measureText(l).width))+pad*2);
  const h=lines.length*lh+8;
  const headLift = speaker==='trump' ? (IS_TOUCH ? 38 : 28) : 0;
  const headY = y-52-headLift;        // Trump bubbles sit higher on mobile
  let bx = x - w/2;                   // centered over speaker …
  bx = clamp(bx, CAM.x+6, CAM.x+CAM.viewW-w-6); // … but inside the view
  let by = headY - h - 10;            // whole box above the head
  const overlaps=(r1,r2)=>!(r1.x+r1.w<r2.x||r2.x+r2.w<r1.x||r1.y+r1.h<r2.y||r2.y+r2.h<r1.y);
  let tries=0;
  while (placed.some(r=>overlaps({x:bx,y:by,w,h},r)) && tries<8){ by-=(h+10); tries++; }
  by = Math.max(by, 6);               // never off the top of the world
  placed.push({x:bx,y:by,w,h});
  const pal = BUBBLE_PAL[speaker]||BUBBLE_PAL.default;
  ctx.fillStyle=pal.fill; ctx.strokeStyle=pal.stroke; ctx.lineWidth=1.5;
  roundRectPath(ctx,bx,by,w,h,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle=pal.text;
  lines.forEach((l,i)=>ctx.fillText(l,bx+pad,by+lh*(i+0.7)));
  // tail: from bubble bottom down toward the head
  const tx = clamp(x, bx+14, bx+w-14);
  ctx.beginPath(); ctx.fillStyle=pal.tail;
  ctx.moveTo(tx-7,by+h-1); ctx.lineTo(tx+7,by+h-1); ctx.lineTo(x, Math.min(headY, by+h+16));
  ctx.closePath(); ctx.fill();
}
function renderActorBubble(actor,placed,speaker,yAdjust){
  if (actor.speakingUntil > now()){
    drawBubble(actor.say, actor.x, actor.y+(yAdjust||0), speaker, placed);
  }

const P_SPAWN = {
  blood:{vx:[-30,30],vy:[-70,-10],life:[400,700],size:[3,5]},
  sparks:{vx:[-60,60],vy:[-180,-40],life:[300,600],size:[2,4]},
  oil:{vx:[-30,30],vy:[-200,-80],life:[900,1500],size:[3,6],extra:{landed:false}},
  flame:{vx:[-40,40],vy:[40,120],life:[300,550],size:[2,5],colors:['#ff9800','#ffd54f']},

};
function spawnP(type,x,y,count,extra){
  const c=P_SPAWN[type]; if(!c) return;
  for (let i=0;i<count;i++){
    const p={x,y,vx:rand(c.vx[0],c.vx[1]),vy:rand(c.vy[0],c.vy[1]),life:rand(c.life[0],c.life[1]),size:Math.floor(rand(c.size[0],c.size[1]))};
    if (c.colors) p.color=pick(c.colors);
    if (c.rot){ p.rot=Math.random()*6.28; p.rotSpeed=rand(-2,2); }
    if (c.extra) Object.assign(p,c.extra);
    if (extra) Object.assign(p,extra);
    fx[type].push(p);
  }
}
const spawnBlood=(x,y,n=8)=>spawnP('blood',x,y,n);
const spawnSparks=(x,y,n=12)=>spawnP('sparks',x,y,n);
const spawnOil=(x,y,n=18)=>spawnP('oil',x,y,n);
const spawnFlame=(x,y,n=10)=>spawnP('flame',x,y,n);
const spawnConfetti=(x,y,n=40)=>spawnP('confetti',x,y,n);
const spawnDownwash=(x,y)=>spawnP('downwash',x,y,5,{color:'rgba(255,255,255,0.6)'});

function updateFx(dt){
  for (const type of Object.keys(fx)){
    fx[type] = fx[type].filter(p=>{ p.life-=dt*1000; return p.life>0; });
    fx[type].forEach(p=>{
      if (type==='oil'){
        if (!p.landed){ p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
          if (p.y>=GROUND_Y){ p.y=GROUND_Y; p.vy=0; p.vx*=0.5; p.landed=true; p.life+=800; } }
        else { p.vx*=0.9; p.x+=p.vx*dt; }
        return;
      }
      const grav = type==='flame'?0 : type==='blood'?132 : type==='downwash'?104 : 228;
      p.vy += grav*dt;
      p.vx*=0.98; p.vy*=0.98;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      if (p.rotSpeed) p.rot+=p.rotSpeed*dt;
    });
  }
}
function drawFx(){
  ctx.save();
  fx.blood.forEach(p=>{ ctx.globalAlpha=clamp(p.life/400,0,1); ctx.fillStyle='#b31217'; ctx.fillRect(p.x,p.y,p.size,p.size); });
  fx.sparks.forEach(p=>{ const a=clamp(p.life/300,0,1); ctx.globalAlpha=a; ctx.fillStyle=a>.5?'#ffd54f':'#ff9800'; ctx.fillRect(p.x,p.y,p.size,p.size); });
  fx.oil.forEach(p=>{ ctx.globalAlpha=clamp(p.life/900,0.1,1); ctx.fillStyle='#111'; ctx.fillRect(p.x,p.y,p.size,p.size); });
  fx.flame.forEach(p=>{ ctx.globalAlpha=clamp(p.life/300,0,1); ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.size,p.size); });
  fx.downwash.forEach(p=>{ ctx.globalAlpha=clamp(p.life/400,0,1); ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.size,p.size); });
  fx.confetti.forEach(p=>{ ctx.globalAlpha=clamp(p.life/1200,0,1); ctx.fillStyle=p.color;
    ctx.save(); ctx.translate(p.x+p.size/2,p.y+p.size/2); ctx.rotate(p.rot||0); ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore(); });
  ctx.restore(); ctx.globalAlpha=1;
}

/* ================================================================
   8. OVERLAY SYSTEM — choice menu, info card, game over, continue.
   Only one modal at a time. All are tappable AND keyboard-driven.
   ================================================================ */
const CHOICE_COLORS=['#9feaf2','#e7e77b','#f36a6a','#e892f4','#5f79df'];
let choiceOverlay=null; // {header, options:[{key,label}], onKey, selected, boxes}
let infoCard=null;      // {text, onKey}
function openChoice(header, options, onKey){
  choiceOverlay={ header, options:options.map((label,i)=>({key:String(i+1),label})), onKey, selected:0, boxes:[] };
}
function closeChoice(){ choiceOverlay=null; }
function openInfoCard(text,onKey){ infoCard={text,onKey}; }
function closeInfoCard(){ infoCard=null; }
function anyOverlayActive(){ return !!(choiceOverlay||infoCard); }
function closeAllOverlays(){ choiceOverlay=null; infoCard=null; continueOverlay=null; }

function layoutChoice(){
  if (!choiceOverlay) return null;
  const n=choiceOverlay.options.length;
  const boxW=Math.min(VW*0.86, 420), gap=10;
  const boxH=clamp((VH*0.5-gap*(n-1))/n, 44, 60);
  const totalH=boxH*n+gap*(n-1);
  const headerH=choiceOverlay.header?34:0;
  const startY=(VH-totalH-headerH)/2+headerH;
  const x=(VW-boxW)/2;
  choiceOverlay.boxes = choiceOverlay.options.map((o,i)=>({x, y:startY+i*(boxH+gap), w:boxW, h:boxH, key:o.key, label:o.label}));
  return { headerY:startY-14 };
}
function drawChoiceOverlay(){
  const layout=layoutChoice(); if (!layout) return;
  beginScreen();
  ctx.fillStyle='rgba(0,0,0,.82)'; ctx.fillRect(0,0,VW,VH);
  if (choiceOverlay.header){
    ctx.fillStyle='#fff'; ctx.font='800 19px system-ui'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(choiceOverlay.header, VW/2, layout.headerY);
  }
  ctx.textBaseline='middle'; ctx.textAlign='left';
  choiceOverlay.boxes.forEach((b,i)=>{
    ctx.fillStyle=CHOICE_COLORS[i%CHOICE_COLORS.length];
    ctx.fillRect(b.x,b.y,b.w,b.h);
    if (i===choiceOverlay.selected){ ctx.globalAlpha=.18; ctx.fillStyle='#fff'; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.globalAlpha=1; }
    const lw=(i===choiceOverlay.selected?5:3);
    ctx.lineWidth=lw; ctx.strokeStyle='#fff';
    ctx.strokeRect(b.x+lw/2,b.y+lw/2,b.w-lw,b.h-lw);
    let fs=Math.min(24,b.h*0.5); ctx.font=`800 ${fs}px system-ui`;
    while (ctx.measureText(b.label).width > b.w-36 && fs>11){ fs--; ctx.font=`800 ${fs}px system-ui`; }
    ctx.fillStyle='#fff'; ctx.fillText(b.label, b.x+18, b.y+b.h/2);
  });
  ctx.textBaseline='alphabetic';
}
function drawInfoCardOverlay(){
  beginScreen();
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,0,VW,VH);
  const w=Math.min(VW*0.86,620), h=Math.min(VH*0.6,380);
  const x=(VW-w)/2, y=(VH-h)/2;
  ctx.fillStyle='#f7f5ee'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#c9a641'; ctx.lineWidth=6; ctx.strokeRect(x-6,y-6,w+12,h+12);
  ctx.strokeStyle='#8b7355'; ctx.lineWidth=2; ctx.strokeRect(x-2,y-2,w+4,h+4);
  const lines=infoCard.text.split('\n');
  ctx.fillStyle='#333'; ctx.textAlign='center';
  let fs=16;
  ctx.font=`bold ${fs}px system-ui`;
  while (Math.max(...lines.map(l=>ctx.measureText(l).width)) > w-30 && fs>11){ fs--; ctx.font=`bold ${fs}px system-ui`; }
  const lh=fs*1.45, totalH=lines.length*lh;
  const startY=y+(h-totalH)/2+lh*0.8;
  lines.forEach((l,i)=>ctx.fillText(l, x+w/2, startY+i*lh));
  ctx.textAlign='left';
}

const GO = { cause:null, lastScene:null, title:null, subtitle:null, pending:false, timer:null };
let continueOverlay=null;
function gameOverCause(cause, opts){
  opts=opts||{};
  GO.cause=cause||'generic'; GO.lastScene=scene;
  GO.title=opts.title||null; GO.subtitle=opts.subtitle||null;
  if (GO.timer) clearTimeout(GO.timer);
  GO.pending=true;
  GO.timer=setTimeout(()=>{
    GS.overMode='go_'+GO.cause; GS.over=true; GO.pending=false; GO.timer=null;
    GO.shownAt=now(); // tableau animations key off this

}

/* THE core gag (Kristian's original idea): the machine physically cannot
   vote Democrat. Pressing it buzzes, rejects the ballot with escalating

function continueDemocrat(){
  const C=continueOverlay;
  if (!C || C.phase==='done') return;
  C.demAttempts++;
  C.lastDemAt=now();
  C.shakeUntil=now()+600;
  const msgs=['INVALID BALLOT','RECOUNT DENIED','SO RIGGED... FOR YOU'];
  C.reject={ text: msgs[Math.min(C.demAttempts-1, msgs.length-1)], until: now()+1600 };
  ensureAudio();
  tone(140,.25,'sawtooth',.4); setTimeout(()=>tone(110,.3,'sawtooth',.35),120); // buzzer

    setTimeout(()=>{ if (continueOverlay && continueOverlay.phase==='idle') continueSpin(); }, 900);

function drawGameOver(){

  const winH=Math.max(40,sh*0.3), winY=sy+sh*0.5-winH/2;
  ctx.fillStyle='#0a1228'; ctx.fillRect(sx+sw*0.08,winY,sw*0.84,winH);
  ctx.strokeStyle=(C.phase==='done')?'#ffd700':'#6ad3ff'; ctx.lineWidth=3;
  ctx.strokeRect(sx+sw*0.08,winY,sw*0.84,winH);
  // slot state machine
  if (C.phase==='spinning'){
    while (!C.stopped && t>=C.nextAt){
      C.idx=(C.idx+1)%C.words.length;
      C.stepsLeft=Math.max(0,C.stepsLeft-1);
      C.interval+=C.inc; C.nextAt+=C.interval;
      SFX.click();
      if (C.stepsLeft<=1){
        C.idx=C.words.indexOf('TRUMP');
        C.stopped=true; C.phase='done';
        if (!C.grantDone){ GS.lives=(GS.lives|0)+1; C.grantDone=true; renderHUD(); SFX.achievement(); }
      }
    }
  }
  const N=C.words.length;
  const rejecting=C.reject && t<C.reject.until;
  const prev=C.words[(C.idx-1+N)%N], next=C.words[(C.idx+1)%N];
  const cur = rejecting && C.phase!=='done' ? C.reject.text : C.words[C.idx];
  ctx.save(); ctx.beginPath(); ctx.rect(sx+sw*0.08,winY,sw*0.84,winH); ctx.clip();
  const centerY=winY+winH/2;
  const bigF=clamp(winH*0.42,16,26), smallF=bigF*0.7;
  ctx.textBaseline='middle';
  ctx.fillStyle='#5070a0'; ctx.font=`bold ${smallF}px system-ui`;
  ctx.fillText(prev, sx+sw/2, centerY-winH*0.72);
  ctx.fillStyle=rejecting?'#ff4444':(C.phase==='done'?'#ffd700':'#fff');
  let curF=bigF; ctx.font=`bold ${curF}px system-ui`;
  while (ctx.measureText(cur).width>sw*0.78 && curF>11){ curF--; ctx.font=`bold ${curF}px system-ui`; }
  ctx.fillText(cur, sx+sw/2, centerY);
  ctx.fillStyle='#5070a0'; ctx.font=`bold ${smallF}px system-ui`;
  ctx.fillText(next, sx+sw/2, centerY+winH*0.72);
  ctx.restore(); ctx.textBaseline='alphabetic';
  if (C.phase==='done'){
    ctx.save(); ctx.globalAlpha=0.8+0.2*Math.sin(t/200);
    ctx.fillStyle='#ffd700'; ctx.font=`bold ${clamp(sw*0.045,12,16)}px system-ui`;
    ctx.fillText(DATA.CONTINUE.lifeLine, sx+sw/2, winY+winH+22);
    ctx.restore();
    ctx.fillStyle='#ffd700'; ctx.font='18px system-ui';
    for (let i=0;i<6;i++){
      const a=t/1200+i*Math.PI/3;
      ctx.fillText('★', mCX+Math.cos(a)*mW*0.34, mY+mH*0.42+Math.sin(a)*mH*0.22);
    }
  }
  // ---- TWO BIG BUTTONS (Democrat equally inviting — that's the trap) ----
  const btnW=mW*0.4, btnH=Math.max(44,mH*0.14);
  const btnY=mY+mH-btnH-mH*0.06;
  C._btnDem={x:mX+mW*0.06,y:btnY,w:btnW,h:btnH};
  C._btnVote={x:mX+mW-mW*0.06-btnW,y:btnY,w:btnW,h:btnH};
  const bf=clamp(btnW*0.11,12,18);
  // DEMOCRAT (blue, shiny, very pressable)
  roundRectPath(ctx,C._btnDem.x,C._btnDem.y,btnW,btnH,8);
  ctx.fillStyle=rejecting?'#7a1f1f':'#1565c0'; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2.5;
  roundRectPath(ctx,C._btnDem.x+1,C._btnDem.y+1,btnW-2,btnH-2,7); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font=`800 ${bf}px system-ui`; ctx.textBaseline='middle';
  ctx.fillText(rejecting?'⚠ '+C.reject.text:'DEMOCRAT', C._btnDem.x+btnW/2, btnY+btnH/2);
  // TRUMP / VOTE (gold)
  roundRectPath(ctx,C._btnVote.x,C._btnVote.y,btnW,btnH,8);
  ctx.fillStyle='#ffd700'; ctx.fill();
  ctx.strokeStyle='#8a6d00'; ctx.lineWidth=2.5;
  roundRectPath(ctx,C._btnVote.x+1,C._btnVote.y+1,btnW-2,btnH-2,7); ctx.stroke();
  ctx.fillStyle='#1a0f00';
  ctx.fillText(C.phase==='done'?'CONTINUE ▶':'★ VOTE ★', C._btnVote.x+btnW/2, btnY+btnH/2);
  ctx.textBaseline='alphabetic';
  // ---- Trump figure beside the machine (space permitting) ----
  const sideSpace=(VW-mW)/2;
  if (sideSpace>70){
    const tCX=mX+mW+sideSpace*0.5, tScale=Math.min(sideSpace/110, mH/240);
    ctx.save(); ctx.translate(tCX, mY+mH+VH*0.06); ctx.scale(tScale*1.6,tScale*1.6); ctx.translate(0,-95);
    ctx.fillStyle='#2b2b2b'; ctx.fillRect(-15,15,30,60);
    ctx.fillStyle='#d8e6ff'; ctx.fillRect(-12,18,24,36);
    ctx.fillStyle='#e02424'; ctx.fillRect(-3,24,6,28);
    ctx.fillStyle='#ffaa66'; ctx.fillRect(-15,-15,30,30);
    ctx.fillStyle='#ffdd44'; ctx.fillRect(-18,-24,36,15);
    ctx.fillStyle='#111'; ctx.fillRect(-9,-3,3,3); ctx.fillRect(6,-3,3,3);
    ctx.fillStyle='#c2185b'; ctx.fillRect(-6,6,12,3);
    ctx.restore();
  }
  // Trump speech bubble (above machine, right side)
  const recentDem = C.lastDemAt && t-C.lastDemAt<2600 && C.phase!=='done';
  const bubText = C.phase==='done' ? DATA.CONTINUE.bubbleWin
                : recentDem ? 'The machine is very smart!'
                : DATA.CONTINUE.bubbleIdle;
  ctx.font='bold 12px "Courier New",monospace';
  const bubW=ctx.measureText(bubText).width+22, bubH=30;
  const bubX=clamp(mX+mW-bubW*0.6, 8, VW-bubW-8), bubY=Math.max(6,mY-38);
  ctx.fillStyle='#fff'; roundRectPath(ctx,bubX,bubY,bubW,bubH,7); ctx.fill();
  ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=1.5; roundRectPath(ctx,bubX,bubY,bubW,bubH,7); ctx.stroke();
  ctx.fillStyle=recentDem?'#c0392b':'#141414';
  ctx.fillText(bubText, bubX+bubW/2, bubY+19);
  // ---- prompt + discreet give-up ----
  if (Math.sin(t/400)>0){
    ctx.fillStyle='#ff00ff'; ctx.font='12px "Courier New",monospace';
    const prompt = C.phase==='done' ? '> Tap CONTINUE to resume'
                 : C.demAttempts>0 ? '> The machine insists. VOTE.'
                 : '> Cast your vote';
    ctx.fillText(prompt, VW/2, mY+mH+VH*0.06+34);
  }
  ctx.font='11px "Courier New",monospace';
  const guText='give up and restart';
  const guW=ctx.measureText(guText).width;
  const guX=VW/2-guW/2, guY=VH-Math.max(16,VH*0.03);
  C._giveUp={x:guX-8,y:guY-14,w:guW+16,h:20};
  ctx.fillStyle='rgba(20,20,20,0.45)';
  ctx.fillText(guText, VW/2, guY);
  ctx.fillRect(guX,guY+3,guW,1);
  ctx.textAlign='left';
}

/* ================================================================
   9. FIGHT ENGINE — Lars boxing match (Greenland)
   Input flows through the normal router (no capture-phase bridges).
   ================================================================ */
const FightEngine = {
  active:false, punchOut:false, countdown:null,
  trumpHP:100, larsHP:100, MAXHP:100,
  punch:{active:false,t:0,dur:160,cd:260,last:-1e9,hit:false},
  lars:{bobT:0,offsetX:0,jab:{active:false,t:0,dur:180,cd:900,last:-1e9,nextAt:0,hit:false}},
  start(){
    this.active=true;
    this.trumpHP=100; this.larsHP=100;
    this.countdown={start:now(),dur:4600};
    this.punch={active:false,t:0,dur:160,cd:260,last:-1e9,hit:false};
    this.lars={bobT:0,offsetX:0,jab:{active:false,t:0,dur:180,cd:900,last:-1e9,nextAt:now()+5600,hit:false}};
    this.punchOut=false;
    player.walking=false; player.walkCycle=0;
    player.say=''; player.speakingUntil=0;
    const L=GL.lars; L.say=''; L.speakingUntil=0;
  },
  stop(result){
    if (!this.active) return;
    this.active=false; this.punchOut=false;
    GL.state.larsFightRequested=false;
    player.walking=false; player.walkCycle=0;
    if (result && result.winner==='trump'){ startGreenlandFlagDrop(); }
  },
  tryPunch(){
    const p=this.punch, t=now();
    if (this.countdown) return;
    if (!p.active && (t-p.last)>=p.cd){ p.active=true; p.t=0; p.last=t; p.hit=false; }
  },
  update(dt, input){
    if (!this.active) return;
    if (this.countdown){
      if (now()-this.countdown.start>=this.countdown.dur) this.countdown=null;
      else return;
    }
    // movement (left/right only along ground)
    let dx=(input.right?1:0)-(input.left?1:0);
    if (dx){
      player.x += dx*CFG.SPEED*(player.speedMul||1)*dt;
      player.facing=Math.sign(dx);
      player.walking=true; player.walkCycle+=dt*8;
    } else { player.walking=false; player.walkCycle=0; }
    player.x=clamp(player.x,40,CAM.worldW-40); player.y=GROUND_Y;
    // Trump punch
    const p=this.punch;
    if (p.active){
      p.t+=dt*1000;
      const k=p.t/p.dur;
      this.punchOut = k>=0.15 && k<0.65;
      if (!p.hit && k>=0.35 && k<=0.55){
        const d=dist2(player.x,player.y,GL.lars.x,GL.lars.y);
        if (d<80){
          this.larsHP=Math.max(0,this.larsHP-10);
          p.hit=true; this._larsFlashUntil=now()+120;
          SFX.punchHit(); spawnSparks((player.x+GL.lars.x)/2,(player.y+GL.lars.y)/2-30, this.larsHP<=0?30:8);
          if (this.larsHP<=0){ triggerShake(10,400); this.stop({winner:'trump'}); return; }
        }
      }
      if (k>=1){ p.active=false; this.punchOut=false; }
    }
    // Lars AI
    const L=this.lars, actor=GL.lars;
    L.bobT+=dt*1000;
    L.offsetX=Math.sin(L.bobT*0.004)*6;
    const gap=player.x-actor.x;
    if (Math.abs(gap)>60) actor.x += Math.sign(gap)*30*dt;
    const jab=L.jab, t=now();
    if (jab.active){
      jab.t+=dt*1000;
      if (!jab.hit && jab.t>=63 && jab.t<=99){
        const d=dist2(player.x,player.y,actor.x,actor.y);
        if (d<80){
          this.trumpHP=Math.max(0,this.trumpHP-12);
          jab.hit=true; this._trumpFlashUntil=now()+120;
          SFX.punchHit(); spawnSparks((player.x+actor.x)/2,(player.y+actor.y)/2-30, this.trumpHP<=0?30:8);
          if (this.trumpHP<=0){
            triggerShake(10,400); SFX.error();
            this.stop({winner:'lars'});
            gameOverCause('lars-fight',{delayMs:600});
            return;
          }
        }
      }
      if (jab.t>=jab.dur) jab.active=false;
    } else if (t>=jab.nextAt){
      jab.active=true; jab.t=0; jab.hit=false;
      jab.nextAt=t+jab.cd+Math.random()*500;
    }
  },
  draw(){
    if (!this.active) return;
    // countdown overlay (screen space)
    if (this.countdown){
      beginScreen();
      const e=now()-this.countdown.start;
      const phases=[
        {t0:0,t1:1600,text:'FIGHT FOR GREENLAND',size:clamp(VW*0.07,26,48),color:'#fff'},
        {t0:1600,t1:2400,text:'3',size:72,color:'#ff4444'},
        {t0:2400,t1:3200,text:'2',size:72,color:'#ffaa00'},
        {t0:3200,t1:4000,text:'1',size:72,color:'#44ff44'},
        {t0:4000,t1:4600,text:'FIGHT!',size:64,color:'#fff'}
      ];
      ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,0,VW,VH);
      for (const ph of phases){
        if (e>=ph.t0 && e<ph.t1){
          const local=e-ph.t0, dur=ph.t1-ph.t0;
          const alpha=Math.min(1,local/200)*Math.min(1,(dur-local)/200);
          const scale=1+(1-Math.min(1,local/150))*0.4;
          ctx.globalAlpha=alpha; ctx.fillStyle=ph.color;
          ctx.font=`bold ${ph.size*scale}px system-ui`;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=12;
          ctx.fillText(ph.text, VW/2, VH/2);
          ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textBaseline='alphabetic'; ctx.textAlign='left';
          break;
        }
      }
      return;
    }
    // world-space fight FX: arms, flashes, HP bars
    beginWorld();
    const trumpX=player.x, trumpY=player.y;
    const larsX=GL.lars.x+this.lars.offsetX, larsY=GL.lars.y;
    // Trump punching arm
    if (this.punchOut){
      const f=player.facing, shX=trumpX+f*6, shY=trumpY-24;
      ctx.strokeStyle='#7a5328'; ctx.lineWidth=5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(shX,shY); ctx.lineTo(shX+f*10,shY+2); ctx.stroke();
      ctx.lineWidth=4.2;
      ctx.beginPath(); ctx.moveTo(shX+f*10,shY+2); ctx.lineTo(shX+f*24,shY); ctx.stroke();
    }
    // Lars jab arm
    if (this.lars.jab.active){
      const lf=(trumpX<larsX)?-1:1, shX=larsX+lf*5, shY=larsY-22;
      ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=4.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(shX,shY); ctx.lineTo(shX+lf*8,shY+2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(shX+lf*8,shY+2); ctx.lineTo(shX+lf*20,shY); ctx.stroke();
      ctx.fillStyle='#f4c59a'; ctx.beginPath(); ctx.arc(shX+lf*20,shY,3,0,Math.PI*2); ctx.fill();
    }
    if (this._larsFlashUntil && now()<this._larsFlashUntil){
      ctx.globalAlpha=.6; ctx.fillStyle='#fff'; ctx.fillRect(larsX-10,larsY-44,20,44); ctx.globalAlpha=1;
    }
    if (this._trumpFlashUntil && now()<this._trumpFlashUntil){
      ctx.globalAlpha=.6; ctx.fillStyle='#fff'; ctx.fillRect(trumpX-10,trumpY-44,20,44); ctx.globalAlpha=1;
    }
    const drawHP=(name,x,y,hp,color,align)=>{
      const w=70,h=12, px=x-w/2, py=y-80;
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(px,py,w,h);
      ctx.fillStyle=color; ctx.fillRect(px,py,w*clamp(hp/this.MAXHP,0,1),h);
      ctx.fillStyle='#fff'; ctx.font='bold 10px system-ui';
      ctx.textAlign = align==='right'?'right':'left';
      ctx.fillText(name, align==='right'?px+w-6:px+6, py+h-3);
      ctx.textAlign='left';
    };
    drawHP('TRUMP',trumpX,trumpY,this.trumpHP,'#f39c12','left');
    drawHP('LARS',larsX,larsY,this.larsHP,'#2e86de','right');
    endWorld();
    // mobile hint: PUNCH button doubles as the E action chip
  }
};

/* ---- Interaction dispatch ---- */
function nearestGL(){
  const arr=[GL.mine,GL.rig,GL.shop,GL.heli,
    ...(GL.bear.alive?[GL.bear]:[]),
    ...(GL.lars.blownUp?[]:[GL.lars]),
    ...GL.glaciers.filter(g=>!g.blown)];
  let best=null,bd=1e9;
  for (const o of arr){
    // NB: glaciers use CENTER distance here (like v1) — their huge bounding
    // box would otherwise swallow every interaction near Lars/bear/shop.
    // The loose rect-check lives only in nearestPlantableGlacier().
    // Glaciers also get a small distance penalty so characters standing in
    // front of a glacier (Lars is at x=890, glacier #2 at x=900!) win.
    let d = o.type==='heli' ? distToRect(player.x,player.y,o.x+20,o.y-6,220,120)
          : dist2(player.x,player.y,o.x,o.y);
    if (o.type==='glacier') d += 25;
    if (d<bd){ bd=d; best=o; }
  }
  return bd < CFG.INTERACT_DIST ? best : null;
}
function nearestPlantableGlacier(){
  let best=null,bd=1e9;
  for (const g of GL.glaciers.filter(g=>!g.blown)){
    const d=distToRect(player.x,player.y,g.x,g.y-g.h/2,g.w,g.h);
    if (d<bd){ bd=d; best=g; }
  }
  return bd<30 ? best : null;
}

let lastPlantAt=0;
const PLANTED=[];
function beginPlant(obj){
  const t=now();
  if (t-lastPlantAt<900) return;
  lastPlantAt=t;
  SFX.buttonPress();
  PLANTED.push({x:obj.x,y:obj.y-12,start:t,ttl:900,lastSparkAt:0});
  consumeDynamite();
  ensureAudio();
  spawnSparks(obj.x,obj.y-20,12);
  if (obj.type==='lars'){
    SFX.explosion(); triggerShake(8,500);
    say(GL.lars,'AAAAHH!',800);
    GL.lars.blownUp=true; GL.lars.vy=-600; GL.lars.vx=400;
    awardMedal('greenland');
    setTimeout(()=>startFlagDrop(),1200);
  } else if (obj.type==='bear'){
    GL.bear.hp=0; GL.bear.angry=true; GL.bear.chasing=true; GL.bear.speed=300;
    SFX.error(); say(GL.bear,'RAAARGH! 🐻',1200); triggerShake(6,400);
  } else if (obj.type==='rig'){
    spawnFlame(GL.rig.x, GL.rig.y-102, 24);
  } else if (obj.type==='glacier'){
    say(player, L.glacierBoom, 1800);
    setTimeout(()=>{
      GL.glaciers.forEach(g=>g.blown=true);
      GL.state.glaciersBlown=true;
      startGlacierExplosion();
    },600);
  } else {
    SFX.explosion(); triggerShake(4,300);
    spawnSparks(obj.x,obj.y-10,15);
    say(player, L.plantGround, 1200);
  }
}

function interactGreenland(){
  if (player.selectedItem==='dynamite'){
    const obj=nearestGL();
    if (obj && (obj.type==='lars'||obj.type==='bear'||obj.type==='rig'||obj.type==='glacier')){ beginPlant(obj); return; }
    const glacier=nearestPlantableGlacier();
    if (glacier){ beginPlant(glacier); return; }
    beginPlant({type:'ground', x:player.x+(player.facing>0?12:-12), y:GROUND_Y});
    return;
  }
  const hasDyn = inventory.find(i=>i.id==='dynamite'&&(i.qty||0)>0);
  const obj=nearestGL();
  if (!obj){ if (hasDyn) say(player, L.dynHintSelect, 1500); return; }
  if (hasDyn && obj.type==='glacier'){ say(player, L.dynHintGlacier, 1800); return; }

  if (obj.type==='mine'){
    if (!GL.state.mineFlagPlanted){
      GL.state.mineFlagPlanted=true;
      say(player, L.mineClaim, 2000);

function larsDialogueStep(){

/* ---- Bear AI ---- */
function updateBear(dt){
  const bear=GL.bear;
  if (!bear.alive) return;
  bear.vx=bear.vx||0; bear.vy=bear.vy||0;
  if (bear.angry && bear.chasing && bear.hp<=0 && bear.y>=GROUND_Y-5){
    const dxT=player.x-bear.x;
    bear.facing=dxT>0?1:-1;
    if (Math.abs(dxT)>30){
      bear.vx += Math.sign(dxT)*bear.speed*dt;
      bear.vx = clamp(bear.vx,-bear.speed,bear.speed);
    } else if (Math.random()<0.02){
      bearAttack(dxT);
    }
  }
  bear.vy += 1400*dt;
  bear.y += bear.vy*dt; bear.x += bear.vx*dt;
  bear.vx *= bear.chasing?0.96:0.92;
  if (bear.y>=GROUND_Y){ bear.y=GROUND_Y; bear.vy=0; bear.vx*=bear.chasing?0.95:0.85; }
  if (bear.x<40){ bear.x=40; bear.vx=Math.abs(bear.vx)*0.3; }
  if (bear.x>CAM.worldW-40){ bear.x=CAM.worldW-40; bear.vx=-Math.abs(bear.vx)*0.3; }
}
function bearAttack(dxT){
  const bear=GL.bear;
  if ((bear.biteCount||0)>=3 || GO.pending || GS.over) return;
  if (GS.nonViolent){ pacifyBear(); return; }
  bear.biteCount=(bear.biteCount||0)+1;
  const fatal=bear.biteCount>=3;
  say(bear, fatal?'CHOMP! 🦷🦷🦷':'CHOMP! 🦷', 800);
  spawnBlood(player.x,player.y-10,fatal?24:8);
  player.x += (Math.sign(dxT)||1)*60;
  SFX.error();
  toast(fatal?'🐻 Fatal bear attack!':`🐻 Bear attack! (${bear.biteCount}/3)`);
  if (fatal) setTimeout(()=>gameOverCause('bear',{delayMs:0}),600);
}
function pacifyBear(){
  const bear=GL.bear;
  if (!bear || !bear.alive) return;
  bear.hp=Math.max(bear.hp||0,1);
  bear.angry=false;
  bear.chasing=false;
  bear.biteCount=0;
  bear.vx=0;
  say(player, L.bearPeace, 1500);
  say(bear,'Brumm?',1200);
  spawnSparks(bear.x,bear.y-24,12);
  SFX.success();
}

const OL = DATA.OVAL.LINES;
const OV = {

  door:{x:140,y:GROUND_Y,type:'door'},

function resetOval(){

function resetOvalDecisions(){
  // 2 random non-Shaman guests + Shaman always last
  const shamanIdx = DATA.OVAL.GUESTS.findIndex(g=>g.id==='shaman');
  const others = DATA.OVAL.GUESTS.map((_,i)=>i).filter(i=>i!==shamanIdx);
  for (let i=others.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [others[i],others[j]]=[others[j],others[i]]; }
  OV.d = {
    phase:'arriving',        // arriving → intro → waiting → guest_entering → guest_asking
                             // → answered → (bonus) → guest_leaving → … → complete/failed
                             // tan detour: tan_reject → aide_in → tan_wait → aide_out → re-ask
    order:[...others.slice(0,2), shamanIdx],
    idx:-1, correct:0, results:[],
    breakingNews:null, feedback:null, timer:0,
    _btnYes:null,_btnNo:null
  };
}
function ovalCurrentGuest(){
  const d=OV.d;
  return (d.idx>=0 && d.idx<d.order.length) ? DATA.OVAL.GUESTS[d.order[d.idx]] : null;
}
function ovalStartIntroCard(){
  OV.d.phase='intro';
  openInfoCard(DATA.OVAL.INTRO_CARD, ()=>{
    closeInfoCard();
    OV.d.phase='waiting'; OV.d.timer=now()+700;
  });
}
function ovalNextGuest(){
  const d=OV.d;
  d.idx++;
  if (d.idx>=d.order.length){
    if (d.correct>=3){
      d.phase='complete';
      say(player, OL.complete, 2500);
      awardMedal('oval');
      startOvalMedalDrop();
    } else {
      d.phase='failed';
      openInfoCard(OL.failCard, ()=>{ closeInfoCard(); resetOvalDecisions(); OV.d.phase='waiting'; OV.d.timer=now()+700; });
    }
    return;
  }
  OV.guest.x=CAM.worldW+60; OV.guest.visible=true;
  OV.guest.say=''; OV.guest.speakingUntil=0;
  d.phase='guest_entering';
}
function ovalAskQuestion(){
  const d=OV.d, g=ovalCurrentGuest();
  if (g.requiresTan && (player.tanLevel||0)<2 && !d.tanSolved){
    OV.guest.say=g.noTanText; OV.guest.speakingUntil=now()+5000;
    d.phase='tan_reject'; d.timer=now()+2600;
    return;
  }
  if (g.requiresTan && (player.tanLevel||0)>=2 && !d.tanPraised){
    d.tanPraised=true;
    OV.guest.say=g.tanPraise; OV.guest.speakingUntil=now()+2200;
    setTimeout(()=>{ if (OV.d.phase==='guest_asking'){ OV.guest.say=g.question; OV.guest.speakingUntil=now()+60000; } },2300);
  } else {
    OV.guest.say=g.question; OV.guest.speakingUntil=now()+60000;
  }
  d.phase='guest_asking';
}
function ovalAnswer(answer){
  const d=OV.d, g=ovalCurrentGuest();
  if (d.phase!=='guest_asking'||!g) return;
  const isCorrect = answer===g.correctAnswer;
  say(player, answer==='yes'?g.yesText:g.noText, 2200);
  OV.guest.speakingUntil=0;
  if (isCorrect){
    d.correct++;
    d.results.push({correct:true});
    d.feedback={text:OL.approveText, good:true, until:now()+2000};
    d.breakingNews={text:g.newsCorrect, good:true, until:now()+4200};
    ovalChoir(true); SFX.success();
  } else {
    d.results.push({correct:false});
    d.feedback={text:OL.rejectText, good:false, until:now()+2000};
    d.breakingNews={text:g.newsWrong, good:false, until:now()+4200};
    ovalChoir(false); SFX.error();
  }
  d.pendingBonus = isCorrect && !!g.triggersBonus;
  d.phase='answered'; d.timer=now()+2100;
}
function ovalChoir(happy){
  OV.yes.say = happy ? pick(DATA.OVAL.PRAISE) : pick(DATA.OVAL.BOO);
  OV.yes.mood = happy ? 'happy' : 'angry';
  OV.yes.speakingUntil = now()+1600;
}
function updateOval(dt){
  const d=OV.d, t=now(), walk=180;
  // aide walking animation states
  if (OV.aide.active){
    if (OV.aide.phase==='in'){
      const target=player.x-55;
      OV.aide.x+=walk*dt;
      if (OV.aide.x>=target){
        OV.aide.x=target; OV.aide.phase='wait';
        say(OV.aide, OL.aideTan, 60000);
      }
    } else if (OV.aide.phase==='out'){
      OV.aide.x-=walk*dt;
      if (OV.aide.x<=-60){ OV.aide.active=false; OV.aide.phase=null; ovalAskQuestion(); }
    }
  }
  switch (d.phase){
    case 'waiting':
      if (t>=d.timer) ovalNextGuest();
      break;
    case 'guest_entering':
      OV.guest.x-=walk*dt;
      if (OV.guest.x<=OV.guestTargetX){ OV.guest.x=OV.guestTargetX; ovalAskQuestion(); }
      break;
    case 'tan_reject':
      if (t>=d.timer){
        d.phase='aide_in';
        OV.aide.active=true; OV.aide.x=-60; OV.aide.phase='in';
        say(player,'Too pale?! Somebody fix this!',1800);
      }
      break;
    case 'answered':
      if (t>=d.timer){
        if (d.pendingBonus){
          d.pendingBonus=false;
          OV.guest.say=OL.bonusHint; OV.guest.speakingUntil=now()+3800;
          d.phase='bonus'; d.timer=now()+3900;
        } else { d.phase='guest_leaving'; }
      }
      break;
    case 'bonus':
      if (t>=d.timer) d.phase='guest_leaving';
      break;
    case 'guest_leaving':
      OV.guest.x+=walk*dt;
      if (OV.guest.x>=CAM.worldW+60){ OV.guest.visible=false; d.phase='waiting'; d.timer=now()+800; }
      break;
  }
  // yes-men blink
  OV.yes.members.forEach(m=>{ if (!m.nextBlink||t>m.nextBlink){ m.blinkUntil=t+120; m.nextBlink=t+2000+Math.random()*2500; } });
}
function ovalApplyTan(){
  if (OV.d.phase!=='aide_in' && OV.d.phase!=='tan_wait') return;
  if (OV.aide.phase!=='wait'){ OV.d.phase='tan_wait'; return; } // wait until aide arrives
  player.tanLevel=Math.max(2, player.tanLevel||0);
  OV.d.tanSolved=true;
  spawnSparks(player.x, player.y-44, 16);
  SFX.success();
  say(player, OL.tanApplied, 1800);
  say(OV.aide, OL.aideDone, 1600);

}
function interactOval(){

function nearestOV(){
  const arr=[OV.door,OV.heli,OV.yes,OV.surprise,
    ...(OV.aide.active&&OV.aide.phase==='wait'?[{...OV.aide,type:'aide'}]:[])];
  let best=null,bd=1e9;
  for (const o of arr){
    const d = o.type==='heli' ? distToRect(player.x,player.y,o.x+20,o.y-6,220,120)
            : dist2(player.x,player.y,o.x,o.y);
    if (d<bd){ bd=d; best=o; }
  }
  return bd<CFG.INTERACT_DIST*1.4 ? best : null;
}

function drawNuke(){
  if (!NUKE.active) return;
  beginScreen();
  const k=Math.min(1,(now()-NUKE.start)/NUKE.dur);
  const x=VW/2, y=(VH+200)-(VH+460)*k;
  const s=Math.max(2,VW/320);
  ctx.save();
  ctx.fillStyle='#bbb'; ctx.fillRect(x-10*s,y-40*s,20*s,40*s);
  ctx.beginPath(); ctx.moveTo(x,y-56*s); ctx.lineTo(x-10*s,y-40*s); ctx.lineTo(x+10*s,y-40*s);
  ctx.closePath(); ctx.fillStyle='#999'; ctx.fill();
  ctx.fillStyle='#777'; ctx.fillRect(x-16*s,y-18*s,6*s,12*s); ctx.fillRect(x+10*s,y-18*s,6*s,12*s);
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(x,y-26*s,6*s,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffd54f';
  for (let i=0;i<3;i++){
    const a0=i*2*Math.PI/3-Math.PI/6;
    ctx.beginPath(); ctx.moveTo(x,y-26*s); ctx.arc(x,y-26*s,5*s,a0,a0+Math.PI/3); ctx.closePath(); ctx.fill();
  }

function nearestKR(){
  const arr=[KR.door,KR.heli,KR.putin,...KR.statues.filter(s=>!s.collected)];
  let best=null,bd=1e9;
  for (const o of arr){
    const d = o.type==='heli' ? distToRect(player.x,player.y,o.x+20,o.y-6,220,120)
            : dist2(player.x,player.y,o.x,o.y);
    if (d<bd){ bd=d; best=o; }
  }
  return bd<CFG.INTERACT_DIST*1.3 ? best : null;
}
function interactKremlin(){

    return;
  }
  const obj=nearestKR(); if (!obj) return;
  if (obj.type==='door'){
    openChoice('Leave the meeting?', ['Stay here','Back to Greenland'], k=>{
      closeChoice(); if (k==='2') switchScene(SCENE.GREENLAND);

/* ---- Security cameras ---- */
function updateCameras(){
  const t=now()/1000;
  KR.cameras.forEach(cam=>{
    const cyc=((t/8)+cam.offset)%1;
    const sweep = cyc<0.5 ? cyc*2 : 2-cyc*2;
    cam.angle = Math.PI/6 + (2*Math.PI/3)*sweep;
  });
}
function pointWatched(px,py){
  for (const cam of KR.cameras){
    const dx=px-cam.x, dy=py-cam.y;
    const a=Math.atan2(dy,dx);
    let diff=Math.abs(cam.angle-a);
    if (diff>Math.PI) diff=2*Math.PI-diff;
    if (diff<=Math.PI/16) return true;
  }
  return false;
}
function tryStealStatue(st){
  if (pointWatched(st.x,st.y-20)){ triggerWagner(); return; }
  st.collected=true;
  OV.shelfLoot=OV.shelfLoot||[];
  OV.shelfLoot.push(st.variant);

}

function updateWagner(dt){
  const w=KR.wagner;
  if (!w||w.escaped||w.caught) return;
  w.soldiers.forEach(s=>{
    const dx=player.x-s.x;
    if (Math.abs(dx)>8) s.x+=Math.sign(dx)*s.speed*dt;
  });
  // escape: reach the helicopter WITH gold sneakers
  const heliD=distToRect(player.x,player.y,KR.heli.x+20,KR.heli.y-6,220,120);
  if (heliD<40 && player.goldenShoesOn){
    w.escaped=true;
    say(player, KL.wagnerEscape, 2000);
    SFX.whoosh();
    setTimeout(()=>{
      openChoice('ESCAPE! Where to?', ['Greenland','The White House','Mar-a-Lago'], k=>{
        closeChoice();
        if (k==='1') switchScene(SCENE.GREENLAND);
        else if (k==='2') switchScene(SCENE.OVAL);
        else switchScene(SCENE.GOLF);
      });
    },600);
    return;
  }
  // caught: soldier reaches you, or 6s without sneakers-escape
  const caught = w.soldiers.some(s=>Math.abs(player.x-s.x)<26) ||
                 (now()-w.startedAt>6000 && !player.goldenShoesOn);
  if (caught){
    w.caught=true;

/* ================================================================
   10D. EPSTEIN FILES — rhythm-redaction minigame
   Package B: big REDACT button / tap = E, misses shown as ❌-lives,
   ≤2 misses = success + medal (v1 punished allowed misses at the
   finish line), gentler start / harder ending, 🛑 glyph on blue names.
   ================================================================ */
const EL = DATA.EPSTEIN.LINES;
const EP = {
  active:false, docs:[], scrollY:0, speed:1,
  found:0, missed:0, missesAllowed:2,
  protectedClicks:0, protectedLimit:1,
  assistUntil:0, lastRedact:0,
  targets:[],           // rebuilt each frame: {y,lineRef,kind}
  artRect:null, atArt:false,
  finalArt:{redacted:false, start:0},
  success:null,         // {flawless} success card showing
  toasts:[], markerAnim:null,
  totalTargets:10, introShown:false
};
function generateEpsteinDocs(){
  const D=DATA.EPSTEIN;
  const docs=[];
  for (let d=0;d<12;d++){
    const lines=[];
    const n=15+Math.floor(Math.random()*8);
    for (let i=0;i<n;i++){
      lines.push({ text: pick(D.DOC_TEMPLATES).replace('{name}', pick(D.DUMMY_NAMES)),
                   trump:false, protected:false, redacted:false, redactAt:0, missed:false });
    }
    docs.push(lines);
  }
  // exactly 10 Trump targets, spread evenly, last doc guaranteed ≥1
  let placed=0;
  for (let i=0;i<EP.totalTargets;i++){
    const dIdx=Math.min(11, Math.floor(i*12/EP.totalTargets)+(Math.random()<0.5?0:1));
    const doc=docs[Math.min(11,dIdx)];
    for (let tries=0;tries<40;tries++){
      const line=pick(doc);
      if (line.trump||line.protected) continue;
      line.text=pick(D.DOC_TEMPLATES).replace('{name}', pick(D.TRUMP_VARIATIONS));
      line.trump=true; placed++; break;
    }
  }
  if (!docs[11].some(l=>l.trump)){
    for (let tries=0;tries<200;tries++){
      const line=pick(docs[11]);
      if (line.trump||line.protected) continue;
      line.text=pick(D.DOC_TEMPLATES).replace('{name}', pick(D.TRUMP_VARIATIONS));
      line.trump=true; placed++; break;
    }
  }
  EP.totalTargets=docs.reduce((a,doc)=>a+doc.filter(l=>l.trump).length,0);
  // 3× each protected name
  D.PROTECTED.forEach(pname=>{
    let put=0, tries=0;
    while (put<3 && tries++<400){
      const line=pick(pick(docs));
      if (line.trump||line.protected) continue;
      line.text=pick(D.DOC_TEMPLATES).replace('{name}', pname);
      line.protected=true; put++;
    }
  });
  return docs;
}
function resetEpstein(){
  Object.assign(EP,{
    active:false, docs:generateEpsteinDocs(), scrollY:-140,
    found:0, missed:0, protectedClicks:0, assistUntil:0, lastRedact:0,
    targets:[], artRect:null, atArt:false,
    finalArt:{redacted:false,start:0}, success:null, toasts:[], markerAnim:null
  });
  openInfoCard(DATA.EPSTEIN.INTRO_CARD, ()=>{
    closeInfoCard();
    EP.active=true;
  });
}
/* geometry helpers (screen space) */
function epPaper(){
  const narrow=VW<640;
  const px=narrow?8:VW*0.16, pw=narrow?VW-16:VW*0.68;
  return { x:px, y:VH*0.08, w:pw, h:VH*0.84,
           fs: clamp(pw/34, 10, 14) };
}
function epZone(){
  const p=epPaper();
  const zh=Math.max(48,p.h*0.09);
  let cy=p.y+p.h*0.5;
  if (EP.atArt && EP.artRect && !EP.finalArt.redacted){
    const artC=EP.artRect.y+EP.artRect.h*0.33;
    if (artC>p.y && artC<p.y+p.h) cy=artC;
  }
  return { top:cy-zh/2, bottom:cy+zh/2, cy, h:zh };
}
function updateEpstein(dt){
  if (!EP.active || anyOverlayActive() || GS.over || EP.success) return;
  const p=epPaper(), lineH=p.fs*1.6;
  // total content height
  let totalH=30;
  EP.docs.forEach(doc=>{ totalH+=lineH*1.5+doc.length*lineH+lineH; });
  totalH+=360;
  const k=clamp(EP.scrollY/totalH,0,1);
  // package B curve: readable start, panic ending
  EP.speed=2.2+k*7.2;
  if (EP.assistUntil && now()<EP.assistUntil) EP.speed*=0.85;
  let delta=EP.speed*0.75*(dt*60);
  // hold at the final art
  const sharpie=EP.finalArt.redacted && (now()-EP.finalArt.start<2500);
  if (EP.artRect && (!EP.finalArt.redacted || sharpie)){
    const targetTop=p.y+50;
    if (EP.artRect.y-delta<=targetTop || sharpie){
      delta=sharpie?0:Math.max(0,EP.artRect.y-targetTop);
      EP.atArt=true;
    } else EP.atArt=false;
  }
  EP.scrollY+=delta;
  // misses: trump lines that scrolled past the top
  let y=p.y+30-EP.scrollY;
  EP.docs.forEach(doc=>{
    y+=lineH*1.5;
    doc.forEach(line=>{
      if (line.trump && !line.redacted && !line.missed && y<p.y-40){
        line.missed=true;
        EP.missed++;
        SFX.error(); triggerShake(5,200);
        EP.assistUntil=now()+3500;
        EP.toasts.push({x:p.x+70,y:p.y+26,text:EL.missed,color:'#ff5555',start:now(),ttl:900});
        if (EP.missed>EP.missesAllowed){ epsteinFail(); }
      }
      y+=lineH;
    });
    y+=lineH;
  });
}
function epsteinFail(){
  EP.active=false;
  gameOverCause('epstein_fail',{delayMs:700});
}
function epsteinRedact(){ // E key / tap / REDACT button
  if (!EP.active || GS.over || EP.success) return;
  const t=now();
  if (t-EP.lastRedact<150) return;
  const zone=epZone();
  // Intent over geometry: if a RED name is anywhere in the window, that's
  // what the player means — a BLUE name 5px closer must not steal the hit.
  // The blue-trap only fires when a protected name is ALONE in the window.
  let best=null,bd=1e9;
  const inWin=EP.targets.filter(tg=>tg.y>=zone.top-22 && tg.y<=zone.bottom+22);
  const pool=inWin.some(tg=>tg.kind==='trump') ? inWin.filter(tg=>tg.kind==='trump') : inWin;
  for (const tg of pool){
    const d=Math.abs(tg.y-zone.cy);
    if (d<bd){ bd=d; best=tg; }
  }
  if (best){
    EP.lastRedact=t;
    const line=best.line;
    if (best.kind==='protected'){
      EP.protectedClicks++;
      SFX.error(); triggerShake(6,300);
      EP.toasts.push({x:VW/2,y:zone.cy-30,text:EL.penalty,color:'#ff5555',start:t,ttl:1100});
      if (EP.protectedClicks>EP.protectedLimit){ epsteinFail(); }
      return;
    }
    line.redacted=true; line.redactAt=t;
    EP.found++;
    SFX.success();
    EP.markerAnim={y:best.y,x:best.x,w:best.w,start:t,dur:300};
    spawnSparks(VW/2,zone.cy,8);
    EP.toasts.push({x:best.x+best.w/2,y:zone.cy-24,text:EL.redacted,color:'#6cff6c',start:t,ttl:700});
    return;
  }
  // the drawing itself
  if (EP.atArt && EP.artRect && !EP.finalArt.redacted){
    EP.finalArt.redacted=true;
    EP.finalArt.start=t;
    SFX.success();
    EP.toasts.push({x:VW/2,y:EP.artRect.y-10,text:EL.fixedIt,color:'#6cff6c',start:t,ttl:2200});
    setTimeout(()=>{
      // Package B: surviving (≤2 misses) IS success — misses already hurt
      EP.success={flawless: EP.missed===0 && EP.protectedClicks===0};
      awardMedal('epstein');
      SFX.achievement();
    },2400);
    return;
  }
  SFX.click();
}
function drawEpstein(){
  beginScreen();
  const p=epPaper(), lineH=p.fs*1.6, t=now();
  // desk
  ctx.fillStyle='#8B4513'; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(p.x+5,p.y+5,p.w,p.h);
  ctx.fillStyle='#f8f8f8'; ctx.fillRect(p.x,p.y,p.w,p.h);
  // document lines
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x,p.y,p.w,p.h); ctx.clip();
  EP.targets=[];
  let y=p.y+30-EP.scrollY;
  const lm=p.x+14;
  EP.docs.forEach((doc,di)=>{
    if (y>-lineH*2 && y<VH+lineH){
      ctx.fillStyle='#666'; ctx.font=`bold ${p.fs}px monospace`;
      ctx.fillText(`--- CLASSIFIED DOCUMENT ${di+1} ---`, lm, y);
    }
    y+=lineH*1.5;
    doc.forEach(line=>{
      if (y>p.y-lineH && y<p.y+p.h+lineH){
        if (line.redacted){
          const prog=line.redactAt?clamp((t-line.redactAt)/300,0,1):1;
          ctx.fillStyle='#000';
          ctx.font=`bold ${p.fs}px monospace`;
          const tw=Math.min(ctx.measureText(line.text).width, p.w-28);
          ctx.fillRect(lm,y-p.fs*0.8,tw*prog,p.fs*1.15);
        } else if (line.missed){
          ctx.fillStyle='#f4b8b8'; ctx.font=`${p.fs}px monospace`;
          ctx.fillText(line.text, lm, y);
        } else if (line.trump || line.protected){
          const isT=line.trump;
          const label=(isT?'':'🛑 ')+line.text;
          ctx.font=`bold ${p.fs}px monospace`;
          const tw=Math.min(ctx.measureText(label).width, p.w-28);
          ctx.fillStyle=isT?'#ffcccc':'#cce5ff';
          ctx.fillRect(lm-3,y-p.fs*0.85,tw+6,p.fs*1.2);
          ctx.fillStyle=isT?'#d32f2f':'#1565c0';
          ctx.save(); ctx.beginPath(); ctx.rect(p.x,y-lineH,p.w-14,lineH*2); ctx.clip();
          ctx.fillText(label, lm, y);
          ctx.restore();
          // assist pulse after a miss
          if (isT && EP.assistUntil && t<EP.assistUntil){
            const pulse=0.5+0.5*Math.sin(t/200);
            ctx.strokeStyle=`rgba(211,47,47,${0.5+0.4*pulse})`;
            ctx.lineWidth=2+2*pulse;
            ctx.strokeRect(lm-5,y-p.fs*0.95,tw+10,p.fs*1.4);
          }
          EP.targets.push({y, x:lm, w:tw, line, kind:isT?'trump':'protected'});
        } else {
          ctx.fillStyle='#222'; ctx.font=`${p.fs}px monospace`;
          ctx.save(); ctx.beginPath(); ctx.rect(p.x,y-lineH,p.w-14,lineH*2); ctx.clip();
          ctx.fillText(line.text, lm, y);
          ctx.restore();
        }
      }
      y+=lineH;
    });
    y+=lineH;
  });
  // final art (birthday drawing)
  const artW=Math.min(p.w*0.7,300), artH=artW*1.1;
  const artX=p.x+(p.w-artW)/2, artY=y+20;
  EP.artRect={x:artX,y:artY,w:artW,h:artH};
  if (artY<VH+50) drawBirthdayArt(artX,artY,artW,artH);
  ctx.restore(); // unclip
  // golden hit zone
  if (EP.active && !EP.success){
    const z=epZone();
    ctx.fillStyle='rgba(255,215,0,0.15)'; ctx.fillRect(p.x,z.top,p.w,z.h);
    ctx.strokeStyle='rgba(255,215,0,0.8)'; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(p.x,z.top); ctx.lineTo(p.x+p.w,z.top);
    ctx.moveTo(p.x,z.bottom); ctx.lineTo(p.x+p.w,z.bottom);
    ctx.stroke();
    ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(255,215,0,0.4)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(p.x,z.cy); ctx.lineTo(p.x+p.w,z.cy); ctx.stroke();
    ctx.setLineDash([]);
    // TAP TO FIX IT when the art holds in the zone
    if (EP.atArt && !EP.finalArt.redacted){
      ctx.save(); ctx.globalAlpha=0.7+0.3*Math.sin(t/250);
      ctx.fillStyle='#d32f2f'; ctx.font=`800 ${clamp(VW*0.045,18,26)}px system-ui`;
      ctx.textAlign='center';
      ctx.fillText(EL.fixIt, p.x+p.w/2, z.top-14);
      ctx.restore(); ctx.textAlign='left';
    }
  }
  // sharpie suit animation over the art
  if (EP.finalArt.redacted && EP.artRect){
    drawSharpieSuit(EP.artRect, clamp((t-EP.finalArt.start)/2000,0,1));
  }
  // HUD: ❌-lives + found counter + REDACT button
  if (EP.active && !EP.success){
    ctx.font='bold 15px system-ui';
    ctx.fillStyle='rgba(0,0,0,0.75)';
    roundRectPath(ctx,p.x, Math.max(4,p.y-34), 210, 28, 8); ctx.fill();
    let hud=`Redacted ${EP.found}/${EP.totalTargets}   `;
    ctx.fillStyle='#fff';
    ctx.fillText(hud, p.x+10, Math.max(4,p.y-34)+19);
    const hw=ctx.measureText(hud).width;
    for (let i=0;i<3;i++){
      ctx.fillStyle = i<EP.missed ? '#ff4444' : 'rgba(255,255,255,0.25)';
      ctx.fillText('✖', p.x+10+hw+i*18, Math.max(4,p.y-34)+19);
    }
    // big REDACT button (touch primary, E on desktop)
    const bw=Math.min(200,VW*0.5), bh=54;
    const bx=(VW-bw)/2, by2=VH-bh-Math.max(10,VH*0.02);
    EP._btn={x:bx,y:by2,w:bw,h:bh};
    ctx.fillStyle='#1a1a1a';
    roundRectPath(ctx,bx,by2,bw,bh,27); ctx.fill();
    ctx.strokeStyle='#ffd700'; ctx.lineWidth=3;
    roundRectPath(ctx,bx+1.5,by2+1.5,bw-3,bh-3,25); ctx.stroke();
    ctx.fillStyle='#ffd700'; ctx.font='800 20px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(IS_TOUCH?'🖊 REDACT':'🖊 REDACT [E]', bx+bw/2, by2+bh/2);
    ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  }
  // toasts
  EP.toasts=EP.toasts.filter(x=>t-x.start<x.ttl);
  EP.toasts.forEach(x=>{
    const k=(t-x.start)/x.ttl;
    ctx.globalAlpha=1-k;
    ctx.fillStyle=x.color; ctx.font='bold 14px system-ui'; ctx.textAlign='center';
    ctx.fillText(x.text, x.x, x.y-14*k);
    ctx.globalAlpha=1; ctx.textAlign='left';
  });

  if (EP.success) drawEpsteinSuccess();
}
function drawBirthdayArt(x,y,w,h){
  const img=EP._artImg;
  if (img===undefined){
    EP._artImg=null;
    const im=new Image();
    im.onload=()=>{ EP._artImg=im; };
    im.onerror=()=>{ EP._artImg=null; };
    im.src='assets/drawing.png';
  }
  if (img){
    ctx.save(); ctx.imageSmoothingEnabled=false;
    const iw=img.naturalWidth||1, ih=img.naturalHeight||1;
    const s=Math.min(w/iw,h/ih), dw=iw*s, dh=ih*s;
    ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
    ctx.restore();
    return;
  }
  // vector fallback: the silhouette
  ctx.save();
  ctx.lineWidth=Math.max(5,w*0.03); ctx.lineCap='round'; ctx.strokeStyle='#2a2a2a';
  const P=(pts)=>{ ctx.beginPath(); pts.forEach(([nx,ny],i)=>i?ctx.lineTo(x+nx*w,y+ny*h):ctx.moveTo(x+nx*w,y+ny*h)); ctx.stroke(); };
  const left=[[0.40,0.00],[0.40,0.06],[0.32,0.12],[0.10,0.18],[0.12,0.32],[0.18,0.48],[0.22,0.62],[0.18,0.76],[0.22,0.90]];
  P(left); P(left.map(([nx,ny])=>[1-nx,ny]));
  P([[0.38,0.28],[0.32,0.34],[0.38,0.38]]);
  P([[0.62,0.28],[0.68,0.34],[0.62,0.38]]);
  ctx.lineWidth=Math.max(2,w*0.012);
  P([[0.30,0.82],[0.32,0.79],[0.34,0.84],[0.36,0.79],[0.38,0.84],[0.40,0.79],[0.42,0.83]]);
  P([[0.42,0.85],[0.70,0.85]]);
  ctx.restore();
}
function drawSharpieSuit(r,prog){
  ctx.save();
  const barX=r.x+r.w*0.16, barY=r.y+r.h*0.38;
  const barW=r.w*0.68, barH=Math.max(18,r.h*0.13);
  const fillW=barW*clamp(prog/0.72,0,1);
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillRect(barX-5,barY-5,barW+10,barH+10);
  ctx.fillStyle='#050505';
  ctx.fillRect(barX,barY,fillW,barH);
  ctx.strokeStyle='#111'; ctx.lineWidth=Math.max(3,r.w*0.018);

function golfStrike(angle,power){

function golfSurfaceAt(x,y){
  const surfaces=GOLF.hole && GOLF.hole.surfaces;
  if (Array.isArray(surfaces)){
    for (const s of surfaces){
      if (s && s.poly && pointInPolygon(x,y,s.poly)){
        return typeof s.friction==='number' ? s.friction : (GOLF_SURFACE_FRICTION[(s.type||'').toLowerCase()]||0.989);
      }
    }
  }
  return 0.989;
}
function golfResolveWalls(){
  const h=GOLF.hole; if (!h) return;
  const b=h.bounds || {x:0,y:0,w:960,h:540}, ball=GOLF.ball, r=ball.r;
  for (const seg of h.walls||[]){
    const ax=seg.x1??seg[0]?.[0], ay=seg.y1??seg[0]?.[1], bx=seg.x2??seg[1]?.[0], by=seg.y2??seg[1]?.[1];
    if ([ax,ay,bx,by].some(v=>typeof v!=='number')) continue;
    const p=golfProject(ball.x,ball.y,ax,ay,bx,by);
    let dx=ball.x-p.x, dy=ball.y-p.y, d2=dx*dx+dy*dy;
    if (d2<=r*r+0.01){
      let d=Math.sqrt(d2), nx, ny;
      if (d<0.001){
        const vx=bx-ax, vy=by-ay, len=Math.hypot(vx,vy)||1;
        nx=-vy/len; ny=vx/len; d=1;
      } else { nx=dx/d; ny=dy/d; }
      const overlap=r-d+0.45;
      ball.x+=nx*overlap; ball.y+=ny*overlap;
      const dot=ball.vx*nx+ball.vy*ny;
      if (dot<0){ ball.vx-=2*dot*nx; ball.vy-=2*dot*ny; SFX.click(); }
    }
  }
  ball.x=clamp(ball.x,b.x+r,b.x+b.w-r);
  ball.y=clamp(ball.y,b.y+r,b.y+b.h-r);
}

function updateGolf(dt){
  if (GOLF.banner && now()>GOLF.banner.until){
    const cb=GOLF.banner.onDone; GOLF.banner=null;
    if (cb) cb();
  }
  if (GOLF.state==='arrival'){
    const a=GOLF.arrival, k=clamp((now()-a.start)/a.dur,0,1);
    const e=k<0.5?2*k*k:-1+(4-2*k)*k;
    GOLF.playerDraw.x=a.fromX+(a.toX-a.fromX)*e;
    GOLF.playerDraw.y=GOLF.playerStand.y;
    GOLF.playerDraw.walking=k<1; GOLF.playerDraw.walkCycle+=dt*8; GOLF.playerDraw.facing=1;
    if (k>=1){
      GOLF.playerDraw.x=GOLF.playerStand.x; GOLF.playerDraw.walking=false;
      GOLF.state='tutorial'; GOLF.tutorialReadyAt=now()+300;
    }
    return;
  }
  if (GOLF.state==='charging'){
    GOLF.charge.power=clamp(GOLF.charge.power+dt*1.15,0,1);
    GOLF.aim.power=GOLF.charge.power;
    return;
  }
  if (GOLF.state==='rolling'){
    const ball=GOLF.ball;
    ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
    golfResolveWalls();
    const cup=GOLF.hole.cup;
    const speed=Math.hypot(ball.vx,ball.vy);
    if (cup){
      const d=dist2(ball.x,ball.y,cup.x,cup.y);
      if (d<=(cup.r||18)+GOLF_MAGNET_RANGE && speed<GOLF_MAGNET_SPEED){
        const nx=(cup.x-ball.x)/(d||1), ny=(cup.y-ball.y)/(d||1);
        const str=(1-Math.max(0,(d-(cup.r||18))/GOLF_MAGNET_RANGE))*GOLF_MAGNET_STRENGTH;
        ball.vx+=nx*str*dt; ball.vy+=ny*str*dt;
      }
      if (d<=(cup.r||18) && speed<GOLF_CUP_SPEED){
        ball.x=cup.x; ball.y=cup.y; ball.vx=0; ball.vy=0;
        SFX.success(); spawnSparks(ball.x,ball.y,16);
        golfPocketBall();
        return;
      }
    }
    const decay=Math.pow(golfSurfaceAt(ball.x,ball.y),dt*60);
    ball.vx*=decay*0.995; ball.vy*=decay*0.995;
    if (Math.hypot(ball.vx,ball.vy)<6){
      ball.vx=0; ball.vy=0; GOLF.state='aim';
    }
    return;
  }
  if (GOLF.state==='victory' && GOLF.trophy){
    const m=GOLF.trophy, target=GOLF.playerStand.y-60;
    if (m.active){
      m.vy+=300*dt; m.y+=m.vy*dt; m.swing+=dt*4; m.amp*=0.992;
      if (m.y>=target){
        m.y=target; m.active=false; GOLF.trophyReady=true;
        spawnConfetti(GOLF.playerStand.x,target,60); SFX.achievement();
      }
    }
  }
}

function golfKeyDown(e,k){
  if (GOLF.state==='tutorial'){ golfDismissTutorial(); return true; }
  if (GOLF.banner){ GOLF.banner.until=now(); return true; }
  if (GOLF.state==='victory'){ if (GOLF.trophyReady) golfLeave(); return true; }
  if (k==='escape'){ golfLeave(); return true; }
  if (k==='r'){ golfDrop(); return true; }
  if (GOLF.state==='aim'){
    if (k==='arrowleft'){ GOLF.aim.angle-=0.12; return true; }
    if (k==='arrowright'){ GOLF.aim.angle+=0.12; return true; }
    if (k==='e'||e.code==='KeyE'){ GOLF.state='charging'; GOLF.charge={active:true,power:0}; return true; }
  } else if (GOLF.state==='charging'){
    if (k==='arrowleft'){ GOLF.aim.angle-=0.08; return true; }
    if (k==='arrowright'){ GOLF.aim.angle+=0.08; return true; }
  }
  return true;
}
function golfKeyUp(e,k){
  if (GOLF.state==='charging' && (k==='e'||e.code==='KeyE')){
    golfStrike(GOLF.aim.angle,GOLF.charge.power);
    return true;
  }
  return false;
}
function golfPointerDown(e){
  const sx=e.clientX, sy=e.clientY;
  const hit=b=>b&&sx>=b.x&&sx<=b.x+b.w&&sy>=b.y&&sy<=b.y+b.h;
  if (hit(GOLF._btnLeave)){ golfLeave(); return; }
  if (hit(GOLF._btnDrop)){ golfDrop(); return; }
  if (GOLF.state==='tutorial'){ golfDismissTutorial(); return; }
  if (GOLF.banner){ GOLF.banner.until=now(); return; }
  if (GOLF.state==='victory'){ if (GOLF.trophyReady) golfLeave(); return; }
  if (GOLF.state!=='aim') return;
  const bp=golfToScreen(GOLF.ball.x,GOLF.ball.y);
  if (dist2(sx,sy,bp.x,bp.y)>Math.max(34,GOLF.ball.r*GOLF.view.scale*3.5)) return;
  const p=golfToCourse(sx,sy);
  GOLF.aim.active=true; GOLF.aim.pointerId=e.pointerId; GOLF.aim.x=p.x; GOLF.aim.y=p.y;
  golfPointerMove(e);
  try{cvs.setPointerCapture(e.pointerId);}catch(_){}
}
function golfPointerMove(e){
  if (!GOLF.aim.active || GOLF.aim.pointerId!==e.pointerId) return;
  const p=golfToCourse(e.clientX,e.clientY);
  GOLF.aim.x=p.x; GOLF.aim.y=p.y;
  const dx=GOLF.ball.x-p.x, dy=GOLF.ball.y-p.y;
  GOLF.aim.power=clamp(Math.hypot(dx,dy)/GOLF_MAX_DRAG,0,1);
  GOLF.aim.angle=Math.atan2(dy,dx);
}
function golfPointerUp(e){
  if (!GOLF.aim.active || GOLF.aim.pointerId!==e.pointerId) return;
  const power=GOLF.aim.power, angle=GOLF.aim.angle;
  GOLF.aim.active=false; GOLF.aim.pointerId=null;
  try{cvs.releasePointerCapture(e.pointerId);}catch(_){}
  if (power>0.035) golfStrike(angle,power);
}

/* ================================================================
   12. INPUT — one router for keyboard, mouse and touch.
   Mobile: hold left/right half = walk · short tap = intent-tap
   (walk to nearest object + interact) · second-finger tap = jump ·
   contextual action chip = E. No capture-phase hacks.
   ================================================================ */
const keys=new Set();
const input={ left:false, right:false };
let jumpTween=null;
let walkTween=null;

function doJump(){
  if (anyOverlayActive()||jumpTween||GS.over) return;
  jumpTween={start:now(),dur:CFG.JUMP_MS,height:player.capOn?CFG.JUMP_H_CAP:CFG.JUMP_H};
}
function startWalkTo(tx,onDone){
  const dx=Math.abs(tx-player.x);
  const dur=Math.min(900,(dx/(CFG.SPEED*(player.speedMul||1)))*1000+150);
  walkTween={sx:player.x,tx,start:now(),dur:Math.max(100,dur),onDone};
  player.facing=Math.sign(tx-player.x)||player.facing;
}
function stepWalkTween(t){
  if (!walkTween) return false;
  const k=Math.min(1,(t-walkTween.start)/walkTween.dur);
  const e=k<0.5?2*k*k:-1+(4-2*k)*k;
  player.x=walkTween.sx+(walkTween.tx-walkTween.sx)*e;
  player.walking=true; player.walkCycle+=1/60*8;
  if (k>=1){ const cb=walkTween.onDone; walkTween=null; player.walking=false; player.walkCycle=0; cb&&cb(); }
  return true;
}
function interact(){
  if (scene===SCENE.GREENLAND) interactGreenland();
  else if (scene===SCENE.OVAL) interactOval();
  else if (scene===SCENE.KREMLIN) interactKremlin();
}

/* --- Keyboard --- */
addEventListener('keydown', e=>{
  const k=(e.key||'').toLowerCase();
  ensureAudio();
  let handled=false;
  if (scene===SCENE.INTRO){
    if (k==='enter'||e.code==='Enter'){ startGame(); handled=true; }
    if (handled) e.preventDefault();
    return;
  }
  if (GS.over){
    if (GS.overMode && String(GS.overMode).startsWith('go_')){
      startContinueOverlay(); handled=true;
    } else if (GS.overMode==='continue'){
      if (k==='r'&&e.shiftKey){ fullRestartToIntro(); }
      else if (k==='d'){ continueDemocrat(); }
      else continueSpin();
      handled=true;
    }
    if (handled) e.preventDefault();
    return;
  }
  if (FightEngine.active){
    if (k==='arrowleft'||k==='a'){ keys.add('fl'); handled=true; }
    else if (k==='arrowright'||k==='d'){ keys.add('fr'); handled=true; }
    else if (k==='e'||e.code==='KeyE'){ FightEngine.tryPunch(); handled=true; }
    else if (k==='escape'){ FightEngine.stop({winner:null}); handled=true; }
    if (handled) e.preventDefault();
    return;
  }
  // Kremlin overlays: arm wrestling + Ukraine map
  if (tug){
    if (k==='a'||k==='d') tugInput(k);
    e.preventDefault();
    return;
  }
  if (flagOverlay){
    closeFlagOverlay();
    e.preventDefault();
    return;
  }
  if (choiceOverlay){
    const n=choiceOverlay.options.length;
    if (k==='arrowup'||k==='w'){ choiceOverlay.selected=(choiceOverlay.selected-1+n)%n; handled=true; }
    else if (k==='arrowdown'||k==='s'){ choiceOverlay.selected=(choiceOverlay.selected+1)%n; handled=true; }
    else if (k==='enter'||k===' '){ choiceOverlay.onKey(choiceOverlay.options[choiceOverlay.selected].key); handled=true; }
    else if (k>='1'&&k<='9'&&k.length===1){ const i=+k-1; if (i<n){ choiceOverlay.onKey(k); handled=true; } }
    else if (k==='escape'){ closeChoice(); handled=true; }
    if (handled) e.preventDefault();
    return;
  }
  if (infoCard){
    if (k==='escape'){ closeInfoCard(); }
    else { infoCard.onKey && infoCard.onKey(k); }
    e.preventDefault();
    return;
  }
  // Epstein: E = redact, Esc = leave, any key dismisses the success card
  if (scene===SCENE.EPSTEIN){
    if (EP.success){ epsteinDismissSuccess(); }
    else if (k==='escape'){ epsteinLeave(); }
    else if (k==='e'||e.code==='KeyE'){ epsteinRedact(); }
    e.preventDefault();
    return;
  }
  if (scene===SCENE.GOLF){
    if (golfKeyDown(e,k)) e.preventDefault();
    return;
  }
  // Oval answer cards get first claim on 1/2 while a question is live
  if (scene===SCENE.OVAL && OV.d.phase==='guest_asking' && (k==='1'||k==='2')){
    ovalAnswer(k==='1'?'yes':'no');
    e.preventDefault();
    return;
  }
  // normal gameplay
  keys.add(k);
  if (k==='n'){
    GS.nonViolent=!GS.nonViolent;
    toast(GS.nonViolent?'Non-violent mode ON':'Non-violent mode OFF');
    if (GS.nonViolent && scene===SCENE.GREENLAND && GL.bear.angry) pacifyBear();
    handled=true;
  }
  else if (k==='m'){ Music.setMuted(!Music.muted); toast(Music.muted?'🔇 Music off':'🔊 Music on'); handled=true; }
  else if (k==='t'){ doTweet(); handled=true; }
  else if (k===' '||k==='arrowup'){ doJump(); handled=true; }
  else if (k==='b'){ toggleInventory(); handled=true; }
  else if (k>='1'&&k<='4'&&k.length===1){ const id=Object.keys(DATA.ITEMS)[+k-1]; if (id&&hasItem(id)) useItem(id); else if (id) say(player,'No '+DATA.ITEMS[id].name+' in inventory',900); handled=true; }
  else if (k==='d'){ selectDynamite(player.selectedItem!=='dynamite'); handled=true; }
  else if (k==='e'){ interact(); handled=true; }
  else if (k==='r'){
    if (e.shiftKey) fullRestartRun();
    else resetGreenlandRunState();
    if (scene===SCENE.GREENLAND) resetGreenland();
    handled=true;
  }
  if (['arrowleft','arrowright','arrowdown',' '].includes(k)) handled=true;
  if (handled) e.preventDefault();
},{passive:false});
addEventListener('keyup', e=>{
  const k=(e.key||'').toLowerCase();
  if (scene===SCENE.GOLF && golfKeyUp(e,k)){
    e.preventDefault();
    return;
  }
  keys.delete(k);
  if (k==='arrowleft'||k==='a') keys.delete('fl');
  if (k==='arrowright'||k==='d') keys.delete('fr');
});

  if (choiceOverlay){
    layoutChoice();
    const hitBox=choiceOverlay.boxes.find(b=>sx>=b.x&&sx<=b.x+b.w&&sy>=b.y&&sy<=b.y+b.h);
    if (hitBox){ choiceOverlay.selected=choiceOverlay.boxes.indexOf(hitBox); choiceOverlay.onKey(hitBox.key); }
    return;
  }
  if (infoCard){ infoCard.onKey && infoCard.onKey('tap'); return; }
  // Kremlin overlays: every tap is a mash / a dismiss
  if (tug){ tugInput('tap'); return; }
  if (flagOverlay){ closeFlagOverlay(); return; }
  // Epstein: every tap is a redaction attempt (success card: dismiss)
  if (scene===SCENE.EPSTEIN){
    if (EP.success){ epsteinDismissSuccess(); return; }
    epsteinRedact();
    return;
  }
  if (scene===SCENE.GOLF){
    golfPointerDown(e);
    return;
  }
  // Oval answer cards (screen space) — before world taps
  if (scene===SCENE.OVAL && OV.d && OV.d.phase==='guest_asking'){
    const hb=b=>b&&sx>=b.x&&sx<=b.x+b.w&&sy>=b.y&&sy<=b.y+b.h;
    if (hb(OV.d._btnYes)){ ovalAnswer('yes'); return; }
    if (hb(OV.d._btnNo)){ ovalAnswer('no'); return; }
  }
  if (FightEngine.active){
    // fight touch controls: left/right half = move, tap in middle third = punch
    pointers.set(e.pointerId,{x:sx,y:sy,startX:sx,startY:sy,startT:now(),zone:sx<VW/2?-1:1,moved:false,fight:true});
    FightEngine.tryPunch(); // any tap also throws a punch — simple & satisfying
    try{cvs.setPointerCapture(e.pointerId);}catch(_){}
    return;
  }
  // gameplay: register pointer. If another pointer is already held → this is a jump tap.
  if (pointers.size>=1){ doJump(); return; }
  pointers.set(e.pointerId,{x:sx,y:sy,startX:sx,startY:sy,startT:now(),zone:sx<VW/2?-1:1,moved:false});
  try{cvs.setPointerCapture(e.pointerId);}catch(_){}
});
cvs.addEventListener('pointermove', e=>{
  if (scene===SCENE.GOLF){ golfPointerMove(e); return; }
  const p=pointers.get(e.pointerId); if (!p) return;
  p.x=e.clientX; p.y=e.clientY;
  if (Math.hypot(p.x-p.startX,p.y-p.startY)>14) p.moved=true;
  p.zone = p.x<VW/2?-1:1;
});
function releasePointer(e){
  if (scene===SCENE.GOLF){ golfPointerUp(e); return; }
  const p=pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (!p) return;
  const heldMs=now()-p.startT;
  if (p.fight) return;
  if (heldMs<250 && !p.moved && !anyOverlayActive() && !GS.over){
    // SHORT TAP → intent-tap: interact, or walk to nearest object and interact
    const w=screenToWorld(p.x,p.y);
    intentTap(w.x,w.y);
  }
}
cvs.addEventListener('pointerup', releasePointer);
cvs.addEventListener('pointercancel', releasePointer);

function intentTap(wx,wy){
  let best=null,bd=1e9,nearFn=null;
  if (scene===SCENE.GREENLAND){
    nearFn=nearestGL;
    // Specific objects win over glaciers: check them first, then glacier rects.
    const targets=[GL.mine,GL.rig,GL.shop,GL.heli,
      ...(GL.bear.alive?[GL.bear]:[]),
      ...(GL.lars.blownUp?[]:[GL.lars])];
    for (const o of targets){
      const d = dist2(wx,wy,o.x,o.y-20);
      if (d<bd){ bd=d; best=o; }
    }
    if (!best || bd>=110){
      for (const g of GL.glaciers.filter(g=>!g.blown)){
        const d = distToRect(wx,wy,g.x,g.y-g.h/2,g.w,g.h);
        if (d<bd){ bd=d; best=g; }
      }
    }
  } else if (scene===SCENE.OVAL){
    nearFn=nearestOV;
    const targets=[OV.door,OV.heli,OV.surprise,OV.yes,
      ...(OV.aide.active&&OV.aide.phase==='wait'?[{...OV.aide,type:'aide'}]:[])];
    for (const o of targets){
      const d = dist2(wx,wy,o.x,o.y-20);
      if (d<bd){ bd=d; best=o; }
    }
  } else if (scene===SCENE.KREMLIN){
    nearFn=nearestKR;
    const targets=[KR.door,KR.heli,KR.putin,...KR.statues.filter(s=>!s.collected)];
    for (const o of targets){
      const d = dist2(wx,wy,o.x,o.y-20);
      if (d<bd){ bd=d; best=o; }
    }
  } else return;
  if (best && bd<110){
    // near enough already? interact now. Otherwise auto-walk then interact.
    const near=nearFn();
    if (near && near.type===best.type){ interact(); return; }
    const side=Math.sign(best.x-player.x)||1;
    const targetX=clamp(best.x-side*(CFG.INTERACT_DIST-6),40,CAM.worldW-40);
    startWalkTo(targetX, ()=>interact());
  } else {
    // tapped empty area: if Trump is already near something, just interact
    if (nearFn()) interact();
  }
}
